<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Project-W - Racing</title>

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles/racing.css">
</head>

<body>
    <div class="layout">
        <div class="main-panel">

            <div class="canvas-container" id="camera-viewport">

                <div class="hud-panel hud-left">
                    <div class="hud-box track-name" id="track-name-display">TRACK NAME</div>
                    <div class="hud-box lap-style" id="lap-box">🏁 <span id="lap-display">1/3</span></div>

                    <div class="hud-box" id="quick-restart-hint"
                        style="display: none; font-size: 14px; cursor: pointer; background: var(--red); color: white; border-color: var(--border-color); transition: transform 0.1s;">
                        🔄 R to Restart
                    </div>
                </div>

                <div class="hud-panel hud-right" id="timer-box">
                    <div style="display: flex; gap: 10px; flex-direction: row; align-items: center;">
                        <div class="hud-box multiplier-style" id="multiplier-box" style="display: none;">
                            ⚡ <span id="multiplier-display">1.00</span>x
                        </div>
                        <div class="hud-box timer-style">⏱️ <span id="hud-timer">0:00.000</span></div>
                    </div>
                </div>

                <div id="arena">
                </div>

                <div id="countdown-overlay" class="overlay" style="display: none;">
                    <span id="countdown-track"></span><br>
                    <span id="countdown-number">3</span>
                </div>
            </div>

        </div>
    </div>

    <div id="podium-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2 style="margin-top: 0; font-size: 32px; color: #2C3E50;">🏁 RACE FINISHED 🏁</h2>
            <ul id="podium-list" style="list-style: none; padding: 0; margin: 20px 0;"></ul>

            <div id="single-mode-controls" style="display: none; gap: 10px; margin-top: 20px;">
                <button id="restart-race-btn" class="btn-green">Restart Race</button>
                <button id="back-to-lobby-btn" class="btn-red">Back to Lobby</button>
            </div>
            <p id="auto-return-text" style="color: #7f8c8d; font-weight: bold; margin-top: 15px; display: none;">
                Returning to lobby...</p>
        </div>
    </div>

    <div id="record-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2>🌟 NEW WORLD RECORD! 🌟</h2>
            <p style="font-weight: 600; font-size: 1.2rem;">You got the best time on this track!<br>Enter 3 initials to
                save your record:</p>
            <input type="text" id="record-name-input" maxlength="3" autocomplete="off"
                style="font-family: 'Fredoka'; font-size: 2rem; font-weight: bold; text-align: center; width: 100px; padding: 10px; border: 3px solid #2C3E50; border-radius: 12px; text-transform: uppercase; margin: 15px 0;">
            <br>
            <button id="submit-record-btn" class="btn-green">Save Record</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="shared/sessioneGiocatore.js?v=20260818a"></script>
    <script src="racing.js"></script>
</body>

</html>
