<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Racing Game 2D</title>
    <link rel="stylesheet" href="styles/racing.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
</head>

<body>
    <main>
        <div id="camera-viewport">
            <div id="arena">
                <canvas id="track-canvas"></canvas>
            </div>
        </div>

        <div id="hud-timer" style="display: none;">00:00.000</div>

        <div id="countdown-overlay" style="display: none;">
            <h1 id="countdown-track">Nome Pista</h1>
            <div id="countdown-number">3</div>
        </div>

        <div id="podium-modal" style="display: none;">
            <h2>🏆 PODIO FINALE 🏆</h2>
            <ol id="podium-list"></ol>

            <p id="auto-return-text">Ritorno alla lobby in corso...</p>

            <div id="single-mode-controls" style="display: none; margin-top: 20px; justify-content: center; gap: 15px;">
                <button id="restart-race-btn"
                    style="padding: 10px 20px; background: #2ecc71; color: white; border: none; cursor: pointer; border-radius: 5px; font-weight: bold; font-size: 16px;">🔄
                    Riavvia Gara</button>
                <button id="back-to-lobby-btn"
                    style="padding: 10px 20px; background: #e74c3c; color: white; border: none; cursor: pointer; border-radius: 5px; font-weight: bold; font-size: 16px;">🚪
                    Torna alla Lobby</button>
            </div>
        </div>
    </main>

    <div id="record-modal"
        style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.95); border: 4px solid #f1c40f; padding: 30px; text-align: center; color: white; z-index: 2000; border-radius: 10px; box-shadow: 0 0 30px #f1c40f;">
        <h2 style="color: #f1c40f; margin-top: 0; text-transform: uppercase; font-size: 28px;">🏆 Nuovo Record Mondiale!
            🏆</h2>
        <p style="font-size: 18px; margin-bottom: 20px;">Sei entrato nella Top 10 assoluta di questa pista!</p>
        <p style="color: #ccc;">Inserisci le tue iniziali (3 lettere):</p>

        <input type="text" id="record-name-input" maxlength="3" autocomplete="off"
            style="font-size: 40px; width: 120px; text-align: center; text-transform: uppercase; font-weight: 900; margin-bottom: 20px; background: #222; color: #f1c40f; border: 2px solid #555; outline: none; letter-spacing: 5px;">
        <br>
        <button id="submit-record-btn"
            style="padding: 12px 25px; font-size: 20px; background: #f1c40f; color: black; border: none; font-weight: 900; cursor: pointer; border-radius: 5px; text-transform: uppercase;">Firma
            la Storia</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="racing.js"></script>
</body>

</html>
