<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prototipo armi toon curve — FPS</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
    #c { display: block; width: 100%; height: 100%; cursor: grab; }
    #c:active { cursor: grabbing; }
    #hud {
        position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
        text-align: center; color: #2b2b2b; user-select: none; pointer-events: none;
    }
    #hud h1 {
        font-size: 18px; letter-spacing: 1px; text-transform: uppercase;
        text-shadow: 0 1px 0 rgba(255,255,255,.7);
    }
    #hud p { font-size: 12px; opacity: .75; margin-top: 2px; }
    #bar {
        position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
        display: flex; gap: 8px; align-items: center;
        background: rgba(30,26,22,.85); padding: 10px 14px; border-radius: 12px;
        border: 2px solid #1a1a1a; box-shadow: 0 4px 14px rgba(0,0,0,.35);
    }
    #bar button {
        font-family: inherit; font-size: 13px; font-weight: 600; letter-spacing: .4px;
        padding: 7px 14px; border-radius: 8px; border: 2px solid #1a1a1a;
        background: #f2e3c2; color: #2b2b2b; cursor: pointer;
    }
    #bar button:hover { background: #ffe9b8; }
    #bar button.active { background: #e9b64f; }
    #bar label {
        color: #f2e3c2; font-size: 13px; display: flex; gap: 6px; align-items: center;
        margin-left: 6px; cursor: pointer;
    }
</style>
</head>
<body>
    <canvas id="c"></canvas>
    <div id="hud">
        <h1>Armi toon curve — prototipo G4.1</h1>
        <p>Trascina per orbitare, rotella per zoom. Bottoni in basso per mettere a fuoco un'arma.</p>
    </div>
    <div id="bar">
        <button data-focus="all" class="active">Panoramica</button>
        <button data-focus="assault">Assalto</button>
        <button data-focus="smg">Thompson</button>
        <button data-focus="shotgun">Doppietta</button>
        <button data-focus="sniper">Cecchino</button>
        <label><input type="checkbox" id="spin" checked> Rotazione</label>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="fps-armi-proto.js"></script>
</body>
</html>
