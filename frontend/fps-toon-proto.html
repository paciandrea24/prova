<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FPS — Prototipo Personaggio Toon</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #87ceeb; }
    #proto-canvas { display: block; width: 100%; height: 100%; }

    /* ── Pannello controlli ── */
    #panel {
        position: fixed; top: 14px; left: 14px; width: 252px;
        background: rgba(13, 16, 24, 0.86); color: #eef1f6;
        border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 12px;
        padding: 14px 16px; font: 13px/1.5 system-ui, sans-serif;
        user-select: none; backdrop-filter: blur(4px);
    }
    #panel h1 { font-size: 15px; letter-spacing: 0.4px; margin-bottom: 2px; }
    #panel .hint { font-size: 11px; color: #9aa4b5; margin-bottom: 10px; }
    #panel label {
        display: flex; align-items: center; gap: 8px;
        padding: 4px 0; cursor: pointer;
    }
    #panel input[type="checkbox"] { accent-color: #5b8def; width: 15px; height: 15px; }
    #panel .row { display: flex; flex-direction: column; gap: 2px; padding: 6px 0 8px; }
    #panel .row span { font-size: 12px; color: #b9c2d0; }
    #panel input[type="range"] { width: 100%; accent-color: #5b8def; }
    #panel .colors { padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.1); margin-top: 6px; }
    #panel .colors span { font-size: 12px; color: #b9c2d0; display: block; margin-bottom: 6px; }
    #panel .colors div { display: flex; gap: 6px; flex-wrap: wrap; }
    #panel .colors button {
        flex: 1; padding: 5px 4px; font: 11px system-ui, sans-serif; color: #dfe5ee;
        background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
        border-radius: 7px; cursor: pointer; white-space: nowrap;
    }
    #panel .colors button.on { background: #3d5fa8; border-color: #6f92da; }
    #panel .sep { border-top: 1px solid rgba(255,255,255,0.1); margin: 6px 0; }
</style>
</head>
<body>
<canvas id="proto-canvas"></canvas>

<div id="panel">
    <h1>Prototipo Personaggio Toon</h1>
    <p class="hint">Trascina per ruotare la vista, rotella per lo zoom.</p>

    <label><input type="checkbox" id="chkRotate" checked> Rotazione automatica</label>
    <label><input type="checkbox" id="chkToon" checked> Cel-shading (off = Lambert attuale)</label>
    <label><input type="checkbox" id="chkOutline" checked> Contorni inchiostro</label>
    <div class="row">
        <span>Spessore contorni</span>
        <input type="range" id="rngThick" min="3" max="34" value="8">
    </div>
    <div class="sep"></div>
    <label><input type="checkbox" id="chkWeapon" checked> Arma in mano</label>
    <label><input type="checkbox" id="chkBigHead"> Mutatore: Teste Giganti</label>
    <label><input type="checkbox" id="chkMini"> Mutatore: Mini Giocatori</label>
    <label><input type="checkbox" id="chkFar"> Vista a distanza (~25 m)</label>

    <div class="colors">
        <span>Colori squadra</span>
        <div>
            <button data-pair="0" class="on">Blu / Rosso</button>
            <button data-pair="1">Verde / Arancio</button>
            <button data-pair="2">Viola / Giallo</button>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="fps-toon-proto.js"></script>
</body>
</html>
