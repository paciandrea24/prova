<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivia Quiz</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Poppins:wght@400;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>

    <div class="game-container">
        <div class="sidebar">
            <h3>Classifica</h3>
            <ul id="score-list">
            </ul>
        </div>

        <div class="main-content">
            <button id="theme-toggle-btn" title="Cambia tema">🌓 Stile</button>
            <div class="header-info">
                <div id="round-info">Round 1/5</div>
                <div class="timer-bar">
                    <div id="timer-fill"></div>
                </div>
            </div>

            <div class="question-box">
                <h1 id="question-text">In attesa della domanda...</h1>

                <img id="question-image" src="" alt="Quiz Image" style="display: none;">
            </div>

            <div class="answers-grid" id="answers-container">
                <button class="answer-btn" data-index="0">Opzione A</button>
                <button class="answer-btn" data-index="1">Opzione B</button>
                <button class="answer-btn" data-index="2">Opzione C</button>
                <button class="answer-btn" data-index="3">Opzione D</button>
            </div>

            <!-- <div id="curiosity-box" style="display: none;">
                <h4>💡 Lo sapevi?</h4>
                <p id="curiosity-text"></p>
            </div> -->

            <div id="status-message">Preparati!</div>
        </div>
    </div>

    <div id="game-over-screen" class="game-over-overlay" style="display: none;">
        <div class="game-over-content">
            <h1>🏆 CLASSIFICA FINALE 🏆</h1>

            <div id="final-podium"></div>

            <div id="host-controls" style="display: none;">
                <button id="btn-play-again" class="action-btn">🔄 Gioca di Nuovo</button>
                <button id="btn-back-lobby" class="action-btn secondary">🏠 Torna alla Lobby</button>
            </div>

            <p id="waiting-host-msg" style="margin-top: 20px; color: #ccc;">In attesa che l'host decida...</p>
        </div>
    </div>

    <div id="image-lightbox" class="lightbox" style="display: none;">
        <span class="close-lightbox">&times;</span>
        <img class="lightbox-content" id="lightbox-img" alt="Zoom Immagine">
    </div>

    <audio id="sound-correct" src="./sounds/triviaGameSounds/rightanswer-95219.mp3" preload="auto"></audio>
    <audio id="sound-wrong" src="./sounds/triviaGameSounds/wronganswer-37702.mp3" preload="auto"></audio>
    <script src="/socket.io/socket.io.js"></script>
    <script src="quiz.js"></script>
</body>

</html>
