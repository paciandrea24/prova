<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drawing Game</title>

    <link rel="stylesheet" href="./styles/game.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Poppins:wght@400;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>
    <div class="header">
        <div class="timer-box">
            <span class="timer-icon">⏱️</span>
            <span class="timer-text">60s</span>
        </div>

        <div class="hint-box">
            <div class="hint-word">
                <p class="hint">In attesa...</p>
            </div>
        </div>

        <div class="game-info">
            <p class="round-info">Round: <span id="current-round">1</span>/<span id="total-rounds">3</span></p>
        </div>
    </div>

    <div class="main-content">

        <div class="standing-box">
            <h3>Classifica</h3>
            <ul class="players-ul"></ul>
        </div>

        <div class="canvas-box">
            <canvas id="drawing-canvas"></canvas>
            <div id="artist-notification"></div>
        </div>

        <div class="chat-box">
            <h3>Chat</h3>
            <div class="messages-box"></div>

            <div class="form-box">
                <form action="" id="chat-form">
                    <input type="text" placeholder="Indovina..." autocomplete="off" id="chat-input">
                    <button type="submit" id="chat-btn">➤</button>
                </form>
            </div>
        </div>
    </div>

    <div id="game-end-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2>Game Over!</h2>
            <div id="final-standings"></div>
            <button id="back-to-lobby" class="submit-button">Torna alla Lobby</button>
        </div>
    </div>

    <div id="round-end-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2>Fine Round!</h2>
            <p>La parola era: <strong id="revealed-word"></strong></p>
            <div id="round-standings"></div>
            <p>Prossimo round...</p>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="game.js"></script>
    <audio id="correctSound" src="./sounds/quiz-game-show-pack-190031 (mp3cut.net).mp3" preload="auto"></audio>
</body>

</html>
