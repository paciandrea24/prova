<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Lobby</title>

    <link rel="stylesheet" href="styles/lobby.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Poppins:wght@400;600;800&display=swap"
        rel="stylesheet">
</head>

<body>
    <button id="theme-toggle-btn" title="Cambia tema">🌓 Stile</button>

    <main>
        <div class="header">
            <div id="lobby-id-container">
                <span id="lobby-id-label">Lobby ID:</span>
                <span id="lobby-id-value">...</span>
            </div>
        </div>

        <div class="main-content">

            <div class="left-side-box">
                <h3>Players</h3>
                <ul class="players-ul">
                    <li>
                        <div class="player-entry-1">
                            <div class="avatar-circle">
                                <div class="avatar-color"></div>
                            </div>
                            <div class="player-info">
                                <p class="player-name">You</p>
                                <p id="host-title"></p>
                            </div>
                        </div>
                    </li>
                </ul>
            </div>

            <div class="right-side-box">
                <h3 id="section-title">Minigames</h3>

                <div class="game-list" id="game-list">
                    <div class="game-selector" data-game-id="drawing">
                        <div class="game-icon">✏️</div>
                        <span class="game-name">Drawing</span>
                    </div>

                    <div class="game-selector" data-game-id="trivia">
                        <div class="game-icon">🧠</div>
                        <span class="game-name">Quiz</span>
                    </div>

                    <div class="game-selector" data-game-id="racing">
                        <div class="game-icon">🏎️</div>
                        <span class="game-name">Racing</span>
                    </div>
                </div>

                <div class="game-settings-panel" id="game-settings-panel" style="display: none;">
                    <div class="settings-content">
                        <div class="settings-section" id="drawing-settings" style="display: none;">
                            <div class="setting-group">
                                <label>Number of Rounds:</label>
                                <select id="drawing-rounds">
                                    <option value="3">3 Rounds</option>
                                    <option value="5">5 Rounds</option>
                                </select>
                            </div>
                            <div class="setting-group">
                                <label>Time per Round:</label>
                                <select id="drawing-time">
                                    <option value="60">60s</option>
                                    <option value="90">90s</option>
                                </select>
                            </div>
                            <div class="setting-group">
                                <label>Difficulty:</label>
                                <select id="drawing-difficulty">
                                    <option value="medium">Medium</option>
                                    <option value="hard">Hard</option>
                                </select>
                            </div>
                        </div>

                        <div class="settings-section" id="trivia-settings" style="display: none;">
                            <div class="setting-group">
                                <label>Number of Questions:</label>
                                <select id="trivia-questions">
                                    <option value="10">10 Questions</option>
                                    <option value="20">20 Questions</option>
                                </select>
                            </div>
                            <div class="setting-group">
                                <label>Time per Question:</label>
                                <select id="trivia-time">
                                    <option value="15">15s</option>
                                    <option value="30" selected>30s</option>
                                </select>
                            </div>
                            <div class="setting-group">
                                <label>Category:</label>
                                <select id="trivia-category">
                                    <option value="general">General</option>
                                    <option value="history">History</option>
                                </select>
                            </div>
                        </div>

                        <div class="settings-section" id="racing-settings" style="display: none;">
                            <div class="setting-group">
                                <label>Difficoltà pista (Ostacoli futuri):</label>
                                <select id="racing-difficulty">
                                    <option value="easy">Semplice</option>
                                    <option value="medium">Media</option>
                                </select>
                            </div>
                            <div class="setting-group">
                                <label>Numero di Circuiti:</label>
                                <select id="racing-numTracks">
                                    <option value="1">Gara Secca (1 Mappa)</option>
                                    <option value="2">Campionato Corto (2 Mappe)</option>
                                    <option value="3" selected>Campionato Medio (3 Mappe)</option>
                                    <option value="4">Campionato Lungo (4 Mappe)</option>
                                </select>
                            </div>
                        </div>

                        <div class="settings-buttons">
                            <button id="back-btn" class="action-button secondary">Back</button>
                            <button id="start-game-btn" class="action-button primary">Start Game</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="chat-box">
                <div class="chat-container">
                    <div class="chat-header-title">💬 Chat</div>

                    <div id="chat-messages" class="chat-messages">
                        <div class="chat-system-msg">Benvenuto nella lobby!</div>
                    </div>

                    <div class="chat-input-area">
                        <input type="text" id="chat-input" placeholder="Scrivi qui..." maxlength="100"
                            autocomplete="off">
                        <button id="send-chat-btn">➤</button>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <button id="leaderboard-btn"
        style="background: #f1c40f; color: black; font-weight: bold; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; margin-left: 10px;">🏆
        Leaderboard</button>

    <div id="global-leaderboard-modal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 3000; justify-content: center; align-items: center;">
        <div
            style="background: #2c3e50; padding: 20px; border-radius: 10px; width: 90%; max-width: 600px; color: white; border: 2px solid #f1c40f; max-height: 80vh; overflow-y: auto;">
            <div
                style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f1c40f; padding-bottom: 10px;">
                <h2 style="margin: 0; color: #f1c40f;">🏆 Hall of Fame</h2>
                <button id="close-leaderboard-btn"
                    style="background: red; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 5px; font-weight: bold;">X</button>
            </div>
            <div id="leaderboard-content" style="margin-top: 20px;">
                <p>Caricamento record in corso...</p>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="lobby.js" defer></script>
</body>

</html>
