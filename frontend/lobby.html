<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/lobby.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>Game Lobby</title>
</head>

<body>
    <main>
        <div class="header">
            <p id="lobby-id"></p>
        </div>

        <div class="main-content">
            <div class="left-side-box">
                <ul class="players-ul">
                    <li>
                        <div class="player-entry-1">
                            <p class="player-entry-text">You are: </p>
                            <div class="avatar-circle">
                                <div class="avatar-color">
                                    <!-- Il colore verrà impostato con JavaScript -->
                                </div>

                            </div>
                            <p id="host-title"></p>
                        </div>
                    </li>
                    <!-- Altri giocatori verranno aggiunti qui dinamicamente -->
                </ul>
                <!-- Qui verrà aggiunto il pulsante per invitare altri giocatori -->
            </div>

            <div class="right-side-box">
                <h3 id="section-title">Minigames</h3>

                <!-- Lista dei giochi (visibile inizialmente) -->
                <div class="game-list" id="game-list">
                    <div class="game-selector" data-game-id="drawing">
                        <img src="./imgs/pencil.png" alt="Drawing Game">
                        <span class="game-name">Drawing</span>
                    </div>

                    <div class="game-selector" data-game-id="trivia">
                        <img src="./imgs/quiz.png" alt="Quiz Game">
                        <span class="game-name">Quiz</span>
                    </div>
                </div>

                <!-- Pannello delle impostazioni (nascosto inizialmente) -->
                <div class="game-settings-panel" id="game-settings-panel" style="display: none;">
                    <div class="settings-content">

                        <!-- Impostazioni per il gioco Drawing -->
                        <div class="settings-section" id="drawing-settings" style="display: none;">
                            <div class="setting-group">
                                <label for="drawing-rounds">Number of Rounds:</label>
                                <select id="drawing-rounds">
                                    <option value="3" selected>3 Rounds</option>
                                    <option value="5">5 Rounds</option>
                                    <option value="7">7 Rounds</option>
                                </select>
                            </div>

                            <div class="setting-group">
                                <label for="drawing-time">Time per Round:</label>
                                <select id="drawing-time">
                                    <option value="60" selected>60 seconds</option>
                                    <option value="90">90 seconds</option>
                                    <option value="120">120 seconds</option>
                                </select>
                            </div>

                            <div class="setting-group">
                                <label for="drawing-difficulty">Word Difficulty:</label>
                                <select id="drawing-difficulty">
                                    <option value="easy">Easy</option>
                                    <option value="medium" selected>Medium</option>
                                    <option value="hard">Hard</option>
                                    <option value="mixed">Mixed</option>
                                </select>
                            </div>
                        </div>

                        <!-- Impostazioni per il gioco Quiz -->
                        <div class="settings-section" id="quiz-settings" style="display: none;">
                            <div class="setting-group">
                                <label for="quiz-questions">Number of Questions:</label>
                                <select id="quiz-questions">
                                    <option value="10" selected>10 Questions</option>
                                    <option value="15">15 Questions</option>
                                    <option value="20">20 Questions</option>
                                </select>
                            </div>

                            <div class="setting-group">
                                <label for="quiz-time">Time per Question:</label>
                                <select id="quiz-time">
                                    <option value="15">15 seconds</option>
                                    <option value="30" selected>30 seconds</option>
                                    <option value="45">45 seconds</option>
                                </select>
                            </div>

                            <div class="setting-group">
                                <label for="quiz-category">Category:</label>
                                <select id="quiz-category">
                                    <option value="general" selected>General Knowledge</option>
                                    <option value="science">Science</option>
                                    <option value="history">History</option>
                                    <option value="sports">Sports</option>
                                    <option value="entertainment">Entertainment</option>
                                </select>
                            </div>
                        </div>

                        <!-- Pulsanti di controllo -->
                        <div class="settings-buttons">
                            <button id="back-btn" class="back-button">Back</button>
                            <button id="start-game-btn" class="start-game-button">Start Game</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="/socket.io/socket.io.js"></script>
    <script src="lobby.js" defer></script>
</body>

</html>
