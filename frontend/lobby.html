<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Project-W - Lobby</title>

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/lobby.css">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1 class="header-title">PROJECT-W</h1>
            <div class="lobby-id" id="lobby-id-container">
                <span id="lobby-id-label">Lobby ID:</span> <span id="lobby-id-value">...</span>
            </div>
        </div>

        <div class="panel column-left">
            <h3 class="panel-title">Players</h3>

            <div class="players-list" id="players-list">
            </div>

        </div>

        <div class="panel column-center">
            <h3 class="panel-title" id="section-title">Select Game</h3>

            <div class="games-grid" id="game-list">
                <div class="game-card" data-game-id="drawing">
                    <span class="g-icon">✏️</span>
                    <span class="g-title">Drawing</span>
                </div>

                <div class="game-card" data-game-id="trivia">
                    <span class="g-icon">🧠</span>
                    <span class="g-title">Quiz</span>
                </div>

                <div class="game-card" data-game-id="racing" style="position: relative;">
                    <span class="g-icon">🏎️</span>
                    <span class="g-title">Racing</span>
                    <button id="leaderboard-mini-btn" class="btn small" title="Global Leaderboard"
                        style="position: absolute; top: -10px; right: -10px; font-size: 16px;">🏆</button>
                </div>
            </div>

            <div class="settings-box" id="game-settings-panel" style="display: none;">
                <h4>⚙️ Settings</h4>

                <div class="settings-section" id="drawing-settings" style="display: none;">
                    <div class="setting-row">
                        <span>Rounds:</span>
                        <select id="drawing-rounds">
                            <option value="3">3</option>
                            <option value="5">5</option>
                        </select>
                    </div>
                    <div class="setting-row">
                        <span>Time:</span>
                        <select id="drawing-time">
                            <option value="60">60s</option>
                            <option value="90">90s</option>
                        </select>
                    </div>
                    <div class="setting-row">
                        <span>Difficulty:</span>
                        <select id="drawing-difficulty">
                            <option value="medium">Medium</option>
                            <option value="hard">Hard</option>
                        </select>
                    </div>
                </div>

                <div class="settings-section" id="trivia-settings" style="display: none;">
                    <div class="setting-row">
                        <span>Questions:</span>
                        <select id="trivia-questions">
                            <option value="10">10</option>
                            <option value="20">20</option>
                        </select>
                    </div>
                    <div class="setting-row">
                        <span>Time:</span>
                        <select id="trivia-time">
                            <option value="15">15s</option>
                            <option value="30" selected>30s</option>
                        </select>
                    </div>
                    <div class="setting-row">
                        <span>Category:</span>
                        <select id="trivia-category">
                            <option value="general">General</option>
                            <option value="history">History</option>
                        </select>
                    </div>
                </div>

                <div class="settings-section" id="racing-settings" style="display: none;">
                    <div class="setting-row">
                        <span>Mode:</span>
                        <select id="racing-mode">
                            <option value="championship">Championship</option>
                            <option value="single">Single Race</option>
                        </select>
                    </div>
                    <div class="setting-row" id="group-numTracks">
                        <span>Tracks:</span>
                        <select id="racing-numTracks">
                            <option value="2">Short (2)</option>
                            <option value="3" selected>Medium (3)</option>
                            <option value="4">Long (4)</option>
                        </select>
                    </div>
                    <div class="setting-row" id="group-trackSelect" style="display: none;">
                        <span>Select Track:</span>
                        <select id="racing-trackName">
                            <option value="Monza">Monza</option>
                            <option value="Spa-Francorchamps">Spa-Francorchamps</option>
                            <option value="Baku">Baku</option>
                            <option value="Bahrain">Bahrain</option>
                            <option value="Interlagos">Interlagos</option>
                            <option value="Barcelona">Barcelona</option>
                            <option value="Melbourne">Melbourne Test</option>
                        </select>
                    </div>
                </div>
            </div>

            <button id="start-game-btn" class="btn green" style="font-size: 24px; padding: 15px; margin-top: auto;"
                disabled>START GAME!</button>
        </div>

        <div class="panel chat-box">
            <h3 class="panel-title">Chat</h3>

            <div class="chat-messages" id="chat-messages">
                <div class="chat-system-msg">Welcome to the lobby!</div>
            </div>

            <div class="chat-input-area">
                <input type="text" id="chat-input" class="chat-input" placeholder="Type here..." maxlength="100"
                    autocomplete="off">
                <button id="send-chat-btn" class="btn-send">➤</button>
            </div>
        </div>

    </div>

    <div id="global-leaderboard-modal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(44, 62, 80, 0.9); z-index: 3000; justify-content: center; align-items: center;">
        <div
            style="background: #FFFFFF; border: 4px solid #2C3E50; border-radius: 16px; padding: 20px; width: 90%; max-width: 600px; box-shadow: 8px 8px 0px #2C3E50; max-height: 80vh; display: flex; flex-direction: column;">
            <div
                style="display: flex; justify-content: space-between; align-items: center; border-bottom: 4px dashed #bdc3c7; padding-bottom: 15px; margin-bottom: 15px;">
                <h2 style="margin: 0; font-family: 'Fredoka', sans-serif; color: #2C3E50; font-size: 28px;">🏆 Hall of
                    Fame</h2>
                <button id="close-leaderboard-btn"
                    style="background: #E74C3C; color: white; border: 3px solid #2C3E50; padding: 5px 15px; cursor: pointer; border-radius: 10px; font-weight: bold; font-family: 'Fredoka', sans-serif; box-shadow: 2px 2px 0px #2C3E50; font-size: 18px;">X</button>
            </div>
            <div id="leaderboard-content" style="overflow-y: auto; font-family: 'Fredoka', sans-serif; color: #2C3E50;">
                <p style="text-align:center;">Loading records...</p>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="lobby.js" defer></script>
</body>

</html>
