<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Racing 3D</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles/f1.css">
</head>
<body>

    <!-- HUD: in alto a sinistra -->
    <div class="hud-panel hud-left">
        <div class="hud-box lap-style" id="lap-box" style="display:none;">🏁 <span id="lap-display">1/3</span></div>
        <div class="hud-box tyre-style" id="tyre-box" style="display:none;">
            <span id="tyre-dot" class="tyre-dot"></span>
            <span id="tyre-label"></span> — <span id="tyre-wear-value">0</span>%
        </div>
    </div>

    <!-- HUD: in alto a destra -->
    <div class="hud-panel hud-right" id="timer-box" style="visibility:hidden;">
        <div style="display:flex; gap:10px; align-items:center;">
            <div class="hud-box timer-style">⏱️ <span id="hud-timer">0:00.000</span></div>
        </div>
        <div class="hud-box standings-box" id="standings-box"></div>
    </div>

    <!-- HUD: velocità in basso al centro -->
    <div class="hud-bottom">
        <div class="speed-box">
            <span id="speed-value">0</span><span class="speed-unit"> km/h</span>
        </div>
    </div>

    <!-- Suggerimento camera -->
    <div class="camera-hint" id="camera-hint">C: cambia visuale · H: hitbox debug</div>

    <!-- Overlay countdown -->
    <div id="countdown-overlay" class="overlay" style="display:none;">
        <span id="countdown-label" class="countdown-track" style="letter-spacing:3px;"></span>
        <span id="countdown-track" class="countdown-track"></span>
        <span id="countdown-number" class="countdown-number">3</span>
    </div>

    <!-- Overlay selezione mescola -->
    <div id="tyre-select-overlay" style="display:none; position:fixed; inset:0; z-index:40;
         flex-direction:column; align-items:center; justify-content:center; gap:20px;
         background:#12121a; color:#ecf0f1; text-align:center;">
        <div style="font-size:28px; font-weight:900; letter-spacing:2px;">SCEGLI LA MESCOLA</div>
        <div id="tyre-preview-frame" style="position:relative; width:520px; max-width:80vw; height:300px;
             border:5px solid #2C3E50; border-radius:16px; overflow:hidden;
             box-shadow:6px 6px 0 rgba(0,0,0,0.35); background:#87CEEB;"></div>
        <div id="tyre-strategy-hint" style="font-size:16px; color:#f1c40f; font-weight:700;"></div>
        <div id="tyre-cards" style="display:flex; gap:18px;"></div>
        <div id="tyre-confirm-status" style="font-size:15px; color:#95a5a6;"></div>
    </div>

    <!-- Pannello pit stop (visibile SOLO al pilota in visita ai box). NON a
         schermo intero apposta: l'auto guida da sola (autopilota), il
         giocatore deve poter continuare a vederla mentre sceglie la mescola. -->
    <div id="pitstop-panel" style="display:none; position:fixed; top:50%; right:20px; transform:translateY(-50%);
         z-index:45; width:460px; max-width:90vw; background:rgba(8,8,12,0.92); color:#ecf0f1; text-align:center;
         border:4px solid #2C3E50; border-radius:16px; padding:18px 16px;
         box-shadow:4px 4px 0 rgba(0,0,0,0.35); flex-direction:column; gap:12px;">
        <div id="pitstop-status" style="font-size:18px; font-weight:900; letter-spacing:1px;">AI BOX</div>
        <div id="pitstop-instructions" style="font-size:13px; color:#ecf0f1;"></div>
        <div id="pitstop-react-prompt" style="display:none; font-size:34px; font-weight:900; color:#2ecc71;">PREMI SPAZIO!</div>
        <div id="pitstop-result" style="font-size:15px; color:#f1c40f; font-weight:700;"></div>
        <div style="font-size:12px; color:#95a5a6;">Mescola per il resto della gara:</div>
        <div id="pitstop-cards" style="display:flex; justify-content:center; gap:10px;"></div>
    </div>

    <!-- Overlay animazione POLE -->
    <div id="pole-overlay" style="display:none; position:fixed; inset:0; z-index:60;
         align-items:center; justify-content:center; overflow:hidden;
         background:rgba(0,0,0,0.55); pointer-events:none;">
        <span id="pole-text" class="pole-text"></span>
    </div>

    <!-- Modale podio -->
    <div id="podium-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <h2 id="podium-title" style="margin-top:0; font-size:32px; color:#2C3E50;">🏁 RACE FINISHED 🏁</h2>
            <ul id="podium-list" style="list-style:none; padding:0; margin:20px 0;"></ul>
            <div id="single-mode-controls" style="display:none; gap:10px; margin-top:20px;">
                <button id="restart-race-btn" class="btn-green">Restart Race</button>
                <button id="back-to-lobby-btn" class="btn-red">Back to Lobby</button>
            </div>
            <p id="auto-return-text" style="color:#7f8c8d; font-weight:bold; margin-top:15px; display:none;">
                Returning to lobby...</p>
        </div>
    </div>

    <!-- Modale record mondiale -->
    <div id="record-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <h2>🌟 NEW WORLD RECORD! 🌟</h2>
            <p style="font-weight:600; font-size:1.2rem;">Best time on this track!<br>Enter 3 initials:</p>
            <input type="text" id="record-name-input" maxlength="3" autocomplete="off"
                style="font-family:'Fredoka'; font-size:2rem; font-weight:bold; text-align:center;
                       width:100px; padding:10px; border:3px solid #2C3E50; border-radius:12px;
                       text-transform:uppercase; margin:15px 0;">
            <br>
            <button id="submit-record-btn" class="btn-green">Save Record</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="shared/trackGeometry.js?v=20260722d"></script>
    <script src="shared/trackMeshBuilder.js?v=20260722d"></script>
    <script src="shared/trackScenery.js?v=20260722d"></script>
    <script src="f1Gamepad.js?v=20260722d"></script>
    <script src="f1.js?v=20260722d"></script>
</body>
</html>
