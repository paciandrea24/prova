<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Racing 3D</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles/f1.css">
</head>
<body>

    <!-- HUD: classifica live — top-left. Popolata da updateStandings() in f1.js -->
    <div class="hud hud-standings hud-panel-neu" id="standings-box" style="display:none;"></div>

    <!-- HUD: giri — top-center, stile broadcast (giro CORRENTE/totale) -->
    <div class="hud hud-lap hud-panel-neu" id="lap-box" style="display:none;">
        <span class="hud-eyebrow">LAP</span>
        <div class="hud-screen"><span class="hud-mono" id="lap-display">1/3</span></div>
    </div>

    <!-- HUD: timer — top-right, SOLO qualifica -->
    <div class="hud hud-timer hud-panel-neu" id="timer-panel" style="display:none;">
        <div class="hud-screen"><span class="hud-mono" id="hud-timer">0:00.000</span></div>
    </div>

    <!-- HUD: velocità — bottom-center -->
    <div class="hud hud-speed hud-panel-neu">
        <div class="hud-screen"><span id="speed-value">0</span><span class="speed-unit"> km/h</span></div>
    </div>

    <!-- HUD: gomme — bottom-left, apribile/chiudibile (tasto T / L1), chiuso di
         default, visibile solo in gara (vedi renderTyreVisibility in f1.js) -->
    <div class="hud hud-tyre-closed hud-panel-neu" id="tyre-closed" style="display:none;" title="T / L1 — apri gomme">
        <span class="tyre-icon-closed" id="tyre-icon-closed"></span>
        <span class="hud-key-hint">T</span>
    </div>
    <div class="hud hud-tyre-open hud-panel-neu" id="tyre-open" style="display:none;">
        <div class="hud-tyre-open-head" id="tyre-open-head">
            <span class="hud-tyre-compound">
                <span class="hud-tyre-compound-dot" id="tyre-compound-dot"></span>
                <span id="tyre-compound-label"></span>
            </span>
            <span class="hud-key-hint">T</span>
        </div>
        <div class="hud-car-top">
            <svg viewBox="0 0 64 122">
                <rect class="wheel" id="wFL" x="4"  y="16" width="11" height="22" rx="3"></rect>
                <rect class="wheel" id="wFR" x="49" y="16" width="11" height="22" rx="3"></rect>
                <rect class="wheel" id="wRL" x="2"  y="88" width="12" height="24" rx="3"></rect>
                <rect class="wheel" id="wRR" x="50" y="88" width="12" height="24" rx="3"></rect>
                <polygon class="car-chassis" stroke-linejoin="round" points="
                    32,6   38,20  38,42  44,52  44,90  37,102 37,113
                    27,113 27,102 20,90  20,52  26,42  26,20" />
                <rect class="car-wing" x="12" y="13"  width="40" height="3.5" rx="1.5"></rect>
                <rect class="car-wing" x="10" y="115" width="44" height="4.5" rx="1.5"></rect>
                <circle class="car-halo" cx="32" cy="47" r="7"></circle>
            </svg>
        </div>
        <div class="hud-tyre-wear-readout">
            <div class="hud-screen"><span class="hud-mono" id="tyre-wear-value">0</span><span class="hud-mono">%</span></div>
            <span class="hud-eyebrow">Usura</span>
        </div>
    </div>

    <!-- HUD: minimappa — bottom-right. Path e marker gestiti da f1.js (anime.js) -->
    <div class="hud hud-minimap hud-panel-neu" id="minimap-box">
        <div class="hud-screen">
            <svg id="minimap-svg" viewBox="0 0 200 140">
                <path id="minimap-track" class="minimap-track-line"></path>
                <path id="minimap-pit" class="minimap-pit-line"></path>
                <g id="minimap-dot">
                    <circle class="minimap-you-halo"></circle>
                    <circle class="minimap-you-core"></circle>
                </g>
            </svg>
        </div>
    </div>

    <!-- Suggerimento camera -->
    <div class="camera-hint" id="camera-hint">C: cambia visuale · H: hitbox debug</div>

    <!-- Overlay countdown: testo 3-2-1 per la qualifica, plancia luci per la
         gara (mostrati alternativamente in base alla fase, vedi f1.js) -->
    <div id="countdown-overlay" class="overlay" style="display:none;">
        <span id="countdown-label" class="countdown-track" style="letter-spacing:3px;"></span>
        <span id="countdown-track" class="countdown-track"></span>
        <span id="countdown-number" class="countdown-number">3</span>
        <div id="lights-board" style="display:none;">
            <span class="light-bulb" id="light-0"></span>
            <span class="light-bulb" id="light-1"></span>
            <span class="light-bulb" id="light-2"></span>
            <span class="light-bulb" id="light-3"></span>
            <span class="light-bulb" id="light-4"></span>
        </div>
    </div>

    <!-- Overlay selezione mescola -->
    <div id="tyre-select-overlay" style="display:none; position:fixed; inset:0; z-index:40;
         flex-direction:column; align-items:center; justify-content:center; gap:20px;
         background:#12121a; color:#ecf0f1; text-align:center;">
        <div style="font-size:28px; font-weight:900; letter-spacing:2px;">SCEGLI LA MESCOLA</div>
        <div id="tyre-preview-frame" style="position:relative; width:520px; max-width:80vw; height:300px;
             border:5px solid #2C3E50; border-radius:16px; overflow:hidden;
             box-shadow:6px 6px 0 rgba(0,0,0,0.35); background:#87CEEB;"></div>
        <div id="tyre-strategy-hint" style="font-size:16px; color:#f1c40f; font-weight:700;"></div>
        <div id="tyre-cards" style="display:flex; gap:18px;"></div>
        <div id="tyre-confirm-status" style="font-size:15px; color:#95a5a6;"></div>
    </div>

    <!-- Pannello pit stop (visibile SOLO al pilota in visita ai box). NON a
         schermo intero apposta: l'auto guida da sola (autopilota), il
         giocatore deve poter continuare a vederla mentre sceglie la mescola. -->
    <div id="pitstop-panel" style="display:none; position:fixed; top:50%; right:20px; transform:translateY(-50%);
         z-index:45; width:460px; max-width:90vw; background:rgba(8,8,12,0.92); color:#ecf0f1; text-align:center;
         border:4px solid #2C3E50; border-radius:16px; padding:18px 16px;
         box-shadow:4px 4px 0 rgba(0,0,0,0.35); flex-direction:column; gap:12px;">
        <div id="pitstop-status" style="font-size:18px; font-weight:900; letter-spacing:1px;">AI BOX</div>
        <div id="pitstop-instructions" style="font-size:13px; color:#ecf0f1;"></div>
        <div id="pitstop-react-prompt" style="display:none; font-size:34px; font-weight:900; color:#2ecc71;">PREMI SPAZIO!</div>
        <div id="pitstop-result" style="font-size:15px; color:#f1c40f; font-weight:700;"></div>
        <div style="font-size:12px; color:#95a5a6;">Mescola per il resto della gara:</div>
        <div id="pitstop-cards" style="display:flex; justify-content:center; gap:10px;"></div>
    </div>

    <!-- Overlay animazione POLE -->
    <div id="pole-overlay" style="display:none; position:fixed; inset:0; z-index:60;
         align-items:center; justify-content:center; overflow:hidden;
         background:rgba(0,0,0,0.55); pointer-events:none;">
        <span id="pole-text" class="pole-text"></span>
    </div>

    <!-- Modale podio -->
    <div id="podium-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <h2 id="podium-title" style="margin-top:0; font-size:32px; color:#2C3E50;">🏁 RACE FINISHED 🏁</h2>
            <ul id="podium-list" style="list-style:none; padding:0; margin:20px 0;"></ul>
            <div id="single-mode-controls" style="display:none; gap:10px; margin-top:20px;">
                <button id="restart-race-btn" class="btn-green">Restart Race</button>
                <button id="back-to-lobby-btn" class="btn-red">Back to Lobby</button>
            </div>
            <p id="auto-return-text" style="color:#7f8c8d; font-weight:bold; margin-top:15px; display:none;">
                Returning to lobby...</p>
        </div>
    </div>

    <!-- Modale record mondiale -->
    <div id="record-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <h2>🌟 NEW WORLD RECORD! 🌟</h2>
            <p style="font-weight:600; font-size:1.2rem;">Best time on this track!<br>Enter 3 initials:</p>
            <input type="text" id="record-name-input" maxlength="3" autocomplete="off"
                style="font-family:'Fredoka'; font-size:2rem; font-weight:bold; text-align:center;
                       width:100px; padding:10px; border:3px solid #2C3E50; border-radius:12px;
                       text-transform:uppercase; margin:15px 0;">
            <br>
            <button id="submit-record-btn" class="btn-green">Save Record</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js"></script>
    <script src="shared/trackGeometry.js?v=20260722d"></script>
    <script src="shared/trackMeshBuilder.js?v=20260722d"></script>
    <script src="shared/trackScenery.js?v=20260722d"></script>
    <script src="f1Gamepad.js?v=20260723a"></script>
    <script src="f1.js?v=20260723a"></script>
</body>
</html>
