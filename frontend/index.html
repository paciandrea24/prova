<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Lobby</title>

    <link rel="stylesheet" href="styles/index.css" />
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Poppins:wght@400;600;800&display=swap"
        rel="stylesheet">
</head>

<body>

    <button id="theme-toggle-btn" title="Cambia tema">🌓 Stile</button>

    <div class="background-icons"></div>

    <main>
        <div class="first-box">
            <p class="label" id="main-title">Choose your color</p>

            <div class="form-box">
                <form id="colorForm">

                    <div class="avatar-box">
                        <div class="avatar-circle">
                            <div class="avatar-color"></div>
                        </div>
                        <p class="helper-text">Click to select</p>
                    </div>
                    <input type="hidden" id="hiddenInputForColorSelection" name="color">

                    <div id="default-actions">
                        <button type="button" id="create-btn" class="submit-button main-btn" disabled>
                            CREATE NEW LOBBY
                        </button>

                        <div class="divider"><span>OR</span></div>

                        <div class="join-row">
                            <input type="text" id="lobby-id-input" placeholder="CODE" maxlength="10" autocomplete="off">
                            <button type="button" id="join-btn" class="submit-button secondary-btn" disabled>
                                JOIN
                            </button>
                        </div>
                    </div>

                    <div id="link-join-actions"
                        style="display: none; width: 100%; flex-direction: column; align-items: center;">
                        <p id="join-link-msg"
                            style="margin-bottom: 20px; font-weight: 700; font-size: 1.1rem; opacity: 0.8;">
                            Joining Lobby...
                        </p>

                        <button type="button" id="link-join-btn" class="submit-button main-btn" disabled>
                            JOIN LOBBY
                        </button>

                        <p class="helper-text" style="margin-top: 15px; cursor: pointer; text-decoration: underline;"
                            onclick="window.location.href='/'">
                            Cancel
                        </p>
                    </div>

                </form>
            </div>
        </div>
    </main>

    <script src="index.js" defer></script>
</body>

</html>
