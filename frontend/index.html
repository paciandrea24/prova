<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Project-W</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/index.css" />
</head>

<body>

    <div class="scene">

        <header class="hero">
            <div class="logo-wrap">
                <span class="logo-project">PROJECT</span><span class="logo-w">-W</span>
            </div>
            <p class="tagline">Pick your color. Enter the lobby.</p>
        </header>

        <button type="button" id="auth-link" class="btn-corner">Login</button>

        <main class="main-panel">
            <form id="colorForm">

                <div class="color-picker" id="color-picker"></div>
                <input type="hidden" id="hiddenInputForColorSelection" name="color">

                <div id="default-actions">

                    <div class="divider"></div>

                    <button type="button" id="create-btn" class="btn btn-create" disabled>
                        Create Lobby
                    </button>

                    <div class="join-group">
                        <input type="text" id="lobby-id-input" class="input-code"
                            placeholder="Room code" maxlength="10" autocomplete="off">
                        <button type="button" id="join-btn" class="btn btn-join" disabled>Join</button>
                    </div>

                    <button type="button" id="browse-btn" class="link-btn">
                        Browse open rooms
                    </button>

                </div>

                <div id="link-join-actions" style="display: none; flex-direction: column; align-items: center;">
                    <div class="divider"></div>
                    <p id="join-link-msg" class="join-msg">Joining lobby…</p>
                    <button type="button" id="link-join-btn" class="btn btn-create" disabled>Join Lobby</button>
                    <p class="cancel-link" onclick="window.location.href='/'">Cancel</p>
                </div>

            </form>
        </main>

    </div>

    <!-- Modal Browse -->
    <div id="lobbies-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <span class="close-modal" id="close-modal">&times;</span>
            <h2>Open Rooms</h2>
            <div id="lobbies-list" class="lobbies-container"></div>
        </div>
    </div>

    <script>
        document.addEventListener('click', e => {
            const c = e.target.closest('.color-circle');
            if (c && !c.classList.contains('disabled')) {
                document.documentElement.style.setProperty('--accent', c.dataset.color);
            }
        });
    </script>

    <script src="index.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" defer></script>
    <script src="shared/firebaseConfig.js" defer></script>
    <script src="hub-auth.js" defer></script>
</body>

</html>
