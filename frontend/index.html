<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Lobby</title>

    <link rel="stylesheet" href="styles/index.css" />
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Poppins:wght@400;600;800&display=swap"
        rel="stylesheet">
</head>

<body>

    <button id="theme-toggle-btn" title="Cambia tema">🌓 Stile</button>

    <div class="background-icons"></div>

    <main>
        <div class="first-box">
            <p class="label" id="main-title">Choose your color</p>

            <div class="form-box">
                <form id="colorForm">

                    <div class="avatar-box">
                        <div class="avatar-circle">
                            <div class="avatar-color"></div>
                        </div>
                        <p class="helper-text">Click to select</p>
                    </div>

                    <input type="hidden" id="hiddenInputForColorSelection" name="color">

                    <div id="lobby-input-container" style="display: none;">
                        <input type="text" id="lobby-id-input" placeholder="Enter Lobby ID" maxlength="10">
                    </div>

                    <button type="submit" class="submit-button" disabled>Choose a color first</button>

                    <p class="toggle-mode-link" id="toggle-join-mode">Have a lobby code? Join here</p>
                </form>
            </div>
        </div>
    </main>

    <script src="index.js" defer></script>
</body>

</html>
