<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Project-W — Livery</title>
    <link rel="stylesheet" href="styles/index.css">
    <link rel="stylesheet" href="styles/livery.css">
</head>

<body>
    <div id="livery-canvas-wrap"></div>

    <div id="livery-panel">
        <h1>Livery Editor</h1>

        <div id="livery-panel-scroll">
            <h2>AI Theme</h2>
            <input type="text" id="ai-prompt" placeholder="e.g. cyberpunk neon" autocomplete="off">
            <button type="button" class="btn-wide btn-generate" id="btn-generate">Generate</button>

            <h2>Colors</h2>
            <div class="color-row">
                <div class="color-swatch"><label for="col-primary">Primary</label><input type="color" id="col-primary" value="#d40000"></div>
                <div class="color-swatch"><label for="col-secondary">Secondary</label><input type="color" id="col-secondary" value="#ffffff"></div>
                <div class="color-swatch"><label for="col-accent">Accent</label><input type="color" id="col-accent" value="#101010"></div>
            </div>

            <h2>Pattern</h2>
            <div class="pattern-grid" id="pattern-grid">
                <button type="button" class="pattern-btn" data-pattern="solid">Solid</button>
                <button type="button" class="pattern-btn" data-pattern="racing_stripes">Racing Stripes</button>
                <button type="button" class="pattern-btn" data-pattern="split_sides">Split Sides</button>
                <button type="button" class="pattern-btn" data-pattern="gradient">Gradient</button>
                <button type="button" class="pattern-btn" data-pattern="halves">Halves</button>
                <button type="button" class="pattern-btn" data-pattern="diagonal">Diagonal</button>
                <button type="button" class="pattern-btn" data-pattern="abstract">Abstract</button>
                <button type="button" class="pattern-btn" data-pattern="top_deck">Top Deck</button>
                <button type="button" class="pattern-btn" data-pattern="tricolor">Tricolor</button>
                <button type="button" class="pattern-btn" data-pattern="checkers">Checkers</button>
                <button type="button" class="pattern-btn" data-pattern="camo">Camo</button>
                <button type="button" class="pattern-btn" data-pattern="waves">Waves</button>
                <button type="button" class="pattern-btn" data-pattern="pinstripe">Pinstripe</button>
                <button type="button" class="pattern-btn" data-pattern="flames">Flames</button>
                <button type="button" class="pattern-btn" data-pattern="tiger">Tiger</button>
                <button type="button" class="pattern-btn" data-pattern="digital_rain">Digital Rain</button>
                <button type="button" class="pattern-btn" data-pattern="patchwork">Patchwork</button>
                <button type="button" class="pattern-btn" data-pattern="speed_lines">Speed Lines</button>
            </div>
        </div>

        <div id="livery-panel-footer">
            <button type="button" class="btn-wide btn-save" id="btn-save">Save</button>
            <button type="button" class="btn-wide btn-back" onclick="window.close()">Back</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="shared/voxelizer.js?v=20260730a"></script>
    <script src="shared/liveryPattern.js?v=20260730a"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" defer></script>
    <script src="shared/firebaseConfig.js" defer></script>
    <script src="livery.js?v=20260730a" defer></script>
</body>

</html>
