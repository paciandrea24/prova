<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spleef 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Un elegante mirino centrale bianco per la prima persona */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 6px;
            background-color: white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            /* Permette ai clic di passarci attraverso */
            z-index: 100;
            box-shadow: 0 0 4px rgba(0, 0, 0, 0.8);
        }

        /* Schermata di Game Over */
        #game-over-modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 37, 47, 0.9);
            z-index: 1000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .btn {
            padding: 15px 30px;
            font-size: 1.2rem;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        #btn-restart {
            background-color: #2ecc71;
        }

        #btn-lobby {
            background-color: #e74c3c;
        }
    </style>
</head>

<body>
    <div id="crosshair"></div>

    <div id="game-over-modal">
        <h1 id="winner-text" style="font-size: 4rem; margin-bottom: 10px; text-shadow: 2px 2px 0px #000;">Game Over</h1>
        <p id="winner-sub" style="font-size: 1.5rem; margin-bottom: 30px;">...</p>

        <div id="host-controls" style="display: none; gap: 20px;">
            <button id="btn-restart" class="btn">🔁 Gioca Ancora</button>
            <button id="btn-lobby" class="btn">🏠 Torna alla Lobby</button>
        </div>
        <p id="waiting-host" style="font-size: 1.2rem; color: #bdc3c7;">In attesa dell'Host...</p>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="spleef.js"></script>
</body>

</html>
