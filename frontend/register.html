<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Project-W — Sign up</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/index.css" />
    <link rel="stylesheet" href="styles/auth.css" />
</head>

<body>

    <div class="scene">

        <header class="hero">
            <div class="logo-wrap">
                <span class="logo-project">PROJECT</span><span class="logo-w">-W</span>
            </div>
            <p class="tagline">Create an account to save your setup.</p>
        </header>

        <main class="main-panel">
            <form id="registerForm">
                <div class="auth-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" autocomplete="off" required>
                </div>
                <div class="auth-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" autocomplete="off" required minlength="6">
                </div>
                <div class="auth-field">
                    <label for="confirmPassword">Confirm password</label>
                    <input type="password" id="confirmPassword" autocomplete="off" required minlength="6">
                </div>

                <button type="submit" id="register-btn" class="btn btn-create">Sign up</button>

                <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>

                <div class="divider"></div>
                <p class="cancel-link">Back</p>
            </form>
        </main>

    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" defer></script>
    <script src="shared/firebaseConfig.js" defer></script>
    <script src="shared/returnTo.js" defer></script>
    <script src="register.js" defer></script>
</body>

</html>
