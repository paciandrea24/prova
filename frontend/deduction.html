<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deduction Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/deduction.css">
    <link rel="stylesheet" href="styles/tasks.css">
</head>

<body>
    <div class="hud">
        <div style="display: flex; flex-direction: column; gap: 10px;">
            <div>Stanza: <strong id="room-display">Caricamento...</strong></div>
            <div>Ruolo: <strong id="role-display">...</strong></div>
            <div id="tasks-list" style="font-size: 14px; margin-top: 10px; color: #f1c40f;"></div>
        </div>

        <div class="progress-container"
            style="width: 300px; height: 20px; background: #2C3E50; border: 2px solid white; border-radius: 10px; overflow: hidden; display: none;"
            id="progress-container">
            <div id="progress-bar" style="width: 0%; height: 100%; background: #2ecc71; transition: width 0.3s ease;">
            </div>
        </div>
    </div>

    <div id="interaction-hint" class="hidden"
        style="position: absolute; top: 75%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 10px; font-family: 'Fredoka', sans-serif; font-size: 20px; pointer-events: none; text-align: center;">
        Avvicinati e premi E per completare la Task
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <div id="role-reveal-overlay" class="overlay hidden">
        <div id="reveal-title" class="role-title"></div>
        <div id="reveal-subtitle" class="role-subtitle"></div>
    </div>

    <div id="game-over-overlay" class="overlay hidden">
        <div id="winner-title" class="role-title"></div>
        <div class="role-subtitle" id="game-over-subtitle">La partita è finita!</div>
        <button id="return-lobby-btn" class="hidden"
            style="margin-top: 30px; padding: 15px 30px; font-size: 24px; font-family: 'Fredoka', sans-serif; background: #f1c40f; color: #2C3E50; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">
            Torna alla Lobby
        </button>
    </div>

    <div id="meeting-overlay" class="overlay hidden" style="z-index: 200; background: rgba(30, 40, 50, 0.95);">
        <div
            style="width: 90%; max-width: 1000px; display: flex; flex-direction: column; align-items: center; height: 80vh;">
            <h1 id="meeting-title" class="role-title" style="color: #e74c3c; font-size: 40px; margin-bottom: 10px;">
                MEETING D'EMERGENZA</h1>
            <h2 id="meeting-timer" style="color: white; margin-bottom: 20px;">Tempo rimasto: --</h2>

            <div style="display: flex; width: 100%; height: 100%; gap: 20px;">
                <div style="flex: 1; display: flex; flex-direction: column;">
                    <div id="voting-grid" class="voting-grid" style="overflow-y: auto; flex: 1;">
                    </div>
                    <div style="margin-top: 15px; width: 100%;">
                        <button id="skip-vote-btn" class="vote-btn skip-btn" style="width: 100%;">Salta il Voto</button>
                    </div>
                    <div id="my-vote-status"
                        style="margin-top: 10px; color: #f1c40f; font-size: 18px; text-align: center;"></div>
                </div>

                <div
                    style="flex: 1; display: flex; flex-direction: column; background: #34495E; border: 3px solid #7f8c8d; border-radius: 10px; overflow: hidden;">
                    <div id="chat-messages"
                        style="flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;">
                    </div>
                    <div style="display: flex; padding: 10px; background: #2C3E50;">
                        <input type="text" id="chat-input" placeholder="Discuti con l'equipaggio..."
                            style="flex: 1; padding: 10px; border-radius: 5px; border: none; font-family: 'Fredoka', sans-serif; font-size: 16px;">
                        <button id="chat-send-btn"
                            style="background: #3498db; color: white; border: none; padding: 10px 20px; margin-left: 10px; border-radius: 5px; cursor: pointer; font-family: 'Fredoka', sans-serif; font-weight: bold; font-size: 16px;">Invia</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="ejection-overlay" class="overlay hidden" style="z-index: 250;">
        <h1 id="ejection-text" class="role-title" style="color: white; font-size: 40px; text-transform: none;">...</h1>
    </div>




    <script src="/socket.io/socket.io.js"></script>
    <script src="tasks/keypadTask.js"></script>
    <script src="tasks/downloadTask.js"></script>
    <script src="tasks/garbageTask.js"></script>
    <script src="tasks/routerTask.js"></script>
    <script src="tasks/engineTask.js"></script>
    <script src="deduction.js"></script>
</body>

</html>
