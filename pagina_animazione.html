<head>

    <title>Disegno Animato Loop</title>
    <style>
        body {
            background-color: #f5f5dc;
            /* colore crema */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        svg {
            width: 300px;
            /* ridimensionato */
            height: auto;
        }

        svg path {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: draw 10s linear infinite alternate;
            stroke: #000;
            stroke-width: 2;
            fill: none;
        }

        /* 10 secondi: 8s animazione + 2s pausa */
        @keyframes draw {
            0% {
                stroke-dashoffset: 1000;
            }

            80% {
                stroke-dashoffset: 0;
            }

            100% {
                stroke-dashoffset: 0;
            }
        }

                stroke-opacity: 0;
