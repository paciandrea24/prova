<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lobby</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #fff;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .lobby-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .lobby-code {
            font-size: 1.2rem;
            font-weight: bold;
            color: #6C63FF;
        }

        .invite-button {
            background: #6C63FF;
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 2rem;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
        }

        .invite-button:hover {
            background: #5a52d4;
        }

        .lists {
            display: flex;
            gap: 2rem;
        }

        .list {
            flex: 1;
            background: #f9f9f9;
            padding: 1.5rem;
            border-radius: 1rem;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
        }

        .list h2 {
            margin-bottom: 1rem;
            font-size: 1.5rem;
            color: #333;
        }

        .list ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .list li {
            padding: 0.5rem 0;
            font-size: 1rem;
            color: #555;
        }

        .game-box {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-top: 1rem;
        }

        .game-box img {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }

        /* Disegni sfondo animati */
        .disegno {
            position: fixed;
            z-index: -1;
            opacity: 0.3;
            animation: ondeggia 8s ease-in-out infinite alternate;
        }

        .disegno path {
            stroke-width: 2;
            fill: none;
            stroke-dasharray: 300;
            stroke-dashoffset: 300;
            animation: disegna 6s ease forwards, disegnoVivo 3s ease-in-out infinite alternate;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @keyframes disegna {
            to {
                stroke-dashoffset: 0;
            }
        }

        @keyframes ondeggia {
            0% {
                transform: translateY(0px) rotate(0deg);
            }

            100% {
                transform: translateY(10px) rotate(3deg);
            }
        }

        @keyframes disegnoVivo {
            0% {
                stroke-width: 1.8;
            }

            100% {
                stroke-width: 2.2;
            }
        }
    </style>
</head>

                </div>
            </div>
        </div>

        // Estrai tutti i path dall'SVG
        function extractPaths(svgString) {
            const paths = [];
            const regex = /<path\s+d="([^"]+)"/g;
            let match;

            while ((match = regex.exec(svgString)) !== null) {
                paths.push(match[1]);
            }

            return paths;
        }

        const pathsArray = extractPaths(svgContent);

        // Funzione per creare un'animazione SVG della Monna Lisa
        function creaDisegnoMonnalisa() {
            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.setAttribute("class", "disegno");

            // Dimensioni e posizione casuali
            const size = Math.floor(Math.random() * 100) + 50; // Da 50 a 150px
            svg.setAttribute("width", size);
            svg.setAttribute("height", size);
            svg.setAttribute("viewBox", "0 0 400 400");

            svg.style.top = Math.random() * 100 + '%';
            svg.style.left = Math.random() * 100 + '%';
            svg.style.opacity = (Math.random() * 0.3 + 0.5).toString();

            // Scegli un path casuale dall'SVG
            const pathD = pathsArray[Math.floor(Math.random() * pathsArray.length)];

            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("d", pathD);
            path.setAttribute("stroke", colori[Math.floor(Math.random() * colori.length)]);

            // Animazione personalizzata per ogni path
            const lunghezzaTrattino = Math.floor(Math.random() * 500) + 300;
            path.setAttribute("stroke-dasharray", lunghezzaTrattino);
            path.setAttribute("stroke-dashoffset", lunghezzaTrattino);

            const durata = Math.floor(Math.random() * 6) + 4; // Da 4 a 10 secondi
            path.style.animation = `disegna ${durata}s ease forwards, disegnoVivo 3s ease-in-out infinite alternate`;

            svg.appendChild(path);
            document.body.appendChild(svg);

            // Rimuovi l'SVG dopo un po'
            setTimeout(() => {
                svg.style.opacity = "0";
                svg.style.transition = "opacity 2s";

                setTimeout(() => {
                    svg.remove();
                }, 2000);
            }, durata * 1000 + 8000);
        }

        // Crea inizialmente un certo numero di disegni
        for (let i = 0; i < 20; i++) {
            setTimeout(creaDisegnoMonnalisa, i * 300);
        }

        // Continua a creare disegni periodicamente
        setInterval(() => {
            creaDisegnoMonnalisa();
        }, 1500);
    </script>
