    <div class="sidebar">

            <div class="tool-btn" id="t-3" onclick="selectTool(3)">🟧 Settore 2</div>

    </div>

    <div class="workspace">
        <canvas id="mapCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');

        let ROWS = 40;
        let COLS = 60;
        const TILE_SIZE = 20;

        let mapData = [];
        let currentTool = 1;
        let isDrawing = false;

        let spawnTileX = 10;
        let spawnTileY = 10;

        const colors = {
            0: '#2ECC71', // Erba
            1: '#bdc3c7', // Asfalto
            2: '#ecf0f1', // Traguardo
            3: '#E67E22', // Settore 2
            4: '#D35400', // Ghiaia
            5: '#2c3e50', // Muro
            6: '#F1C40F'  // Settore 1
        };

        function initMap() {
            mapData = Array(ROWS).fill().map(() => Array(COLS).fill(0));
            canvas.width = COLS * TILE_SIZE;
            canvas.height = ROWS * TILE_SIZE;
            drawMap();
        }

        function resizeMap() {
            COLS = parseInt(document.getElementById('grid-cols').value);
            ROWS = parseInt(document.getElementById('grid-rows').value);
            initMap();
        }

        function selectTool(toolId) {
            currentTool = toolId;
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`t-${toolId}`).classList.add('active');
        }

        function drawMap() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    let tile = mapData[r][c];
                    ctx.fillStyle = colors[tile] || colors[0];
                    ctx.fillRect(c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, TILE_SIZE);

                    ctx.strokeStyle = 'rgba(0,0,0,0.05)';
                    ctx.strokeRect(c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, TILE_SIZE);

                    if (tile === 2) {
                        ctx.fillStyle = '#2c3e50';
                        ctx.fillRect(c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE / 2, TILE_SIZE / 2);
                        ctx.fillRect(c * TILE_SIZE + TILE_SIZE / 2, r * TILE_SIZE + TILE_SIZE / 2, TILE_SIZE / 2, TILE_SIZE / 2);
                    }
                }
            }

            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.arc(spawnTileX * TILE_SIZE + TILE_SIZE / 2, spawnTileY * TILE_SIZE + TILE_SIZE / 2, TILE_SIZE / 2 - 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "white";
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function handlePointer(e) {
            const rect = canvas.getBoundingClientRect();

            // FIX MOUSE: Calcoliamo la scala esatta visto che il CSS ora restringe il canvas!
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;

            const col = Math.floor(x / TILE_SIZE);
            const row = Math.floor(y / TILE_SIZE);

            if (row >= 0 && row < ROWS && col >= 0 && col < COLS) {
                if (currentTool === 'spawn') {
                    if (e.type === 'mousedown') {
                        spawnTileX = col;
                        spawnTileY = row;
                        drawMap();
                    }
                } else {
                    if (isDrawing && mapData[row][col] !== currentTool) {
                        mapData[row][col] = currentTool;
                        drawMap();
                    }
                }
            }
        }

        canvas.addEventListener('mousedown', (e) => { isDrawing = true; handlePointer(e); });
        canvas.addEventListener('mousemove', (e) => { if (isDrawing) handlePointer(e); });
        window.addEventListener('mouseup', () => { isDrawing = false; });

        function exportMap() {
            const trackName = document.getElementById('track-name').value || 'CustomMap';
            const cleanVarName = trackName.replace(/[^a-zA-Z0-9]/g, '');
            const angle = parseInt(document.getElementById('spawn-angle').value) || 0;

            const realSpawnX = spawnTileX * 80;
            const realSpawnY = spawnTileY * 80;

            let out = `const ${cleanVarName}Map = [\n`;
            for (let r = 0; r < ROWS; r++) {
                out += `  /* ${r.toString().padStart(2, '0')} */[` + mapData[r].join(', ') + `]`;
                out += (r < ROWS - 1) ? ",\n" : "\n";
            }
            out += `];\n\n`;

            out += `    {\n`;
            out += `        name: "${trackName}",\n`;
            out += `        map: ${cleanVarName}Map,\n`;
            out += `        spawnX: ${realSpawnX},\n`;
            out += `        spawnY: ${realSpawnY},\n`;
            out += `        angle: ${angle}\n`;
            out += `    }`;

            document.getElementById('output-code').value = out;
        }

        function importMap() {
            try {
                let input = document.getElementById('output-code').value;

                // Trova l'inizio e la fine dell'array
                const startIndex = input.indexOf('[');
                const endIndex = input.lastIndexOf(']');

                if (startIndex === -1 || endIndex === -1) {
                    alert('Errore: Impossibile trovare un array [ ... ] nel testo incollato.');
                    return;
                }

                let arrayStr = input.substring(startIndex, endIndex + 1);

                // 1. Rimuove tutti i commenti stile /* 0 */ o //
                arrayStr = arrayStr.replace(/\/\*[\s\S]*?\*\//g, '').replace(/\/\/.*/g, '');

                // 2. Rimuove eventuali virgole finali "sporche" (es. [0, 0,], )
                arrayStr = arrayStr.replace(/,\s*]/g, ']');

                // 3. Valuta la matrice in modo sicuro forzando l'espressione con ( )
                const importedMap = eval('(' + arrayStr + ')');

                if (Array.isArray(importedMap) && Array.isArray(importedMap[0])) {
                    ROWS = importedMap.length;
                    COLS = importedMap[0].length;
                    document.getElementById('grid-rows').value = ROWS;
                    document.getElementById('grid-cols').value = COLS;

                    mapData = importedMap;
                    canvas.width = COLS * TILE_SIZE;
                    canvas.height = ROWS * TILE_SIZE;
                    drawMap();

                    // Svuota la textarea per comodità
                    document.getElementById('output-code').value = '';
                    alert('✅ Mappa Importata con successo!');
                } else {
                    alert('Formato array non valido. Assicurati di incollare una matrice bidimensionale.');
                }
            } catch (err) {
                alert('❌ Errore di importazione. Controlla la console per i dettagli.');
                console.error(err);
            }
        }

        initMap();
    </script>
</body>

            drawMap();
        }

        // Funzione ridimensiona intelligente (non cancella il vecchio disegno!)
        function resizeMap() {
            let oldData = mapData;
            let oldRows = mapData.length;
            let oldCols = mapData[0].length;

            COLS = parseInt(document.getElementById('grid-cols').value);
            ROWS = parseInt(document.getElementById('grid-rows').value);

            // Crea nuova griglia vuota
            mapData = Array(ROWS).fill().map(() => Array(COLS).fill(0));

            // Ricopia la vecchia mappa
            for (let r = 0; r < Math.min(oldRows, ROWS); r++) {
                for (let c = 0; c < Math.min(oldCols, COLS); c++) {
                    mapData[r][c] = oldData[r][c];
                }
            }

            updateCanvasSize();
            drawMap();
        }

        // AGGIORNAMENTO DIMENSIONI E ZOOM
        function updateCanvasSize() {
            // Le dimensioni interne (pixel veri) restano matematiche
            canvas.width = COLS * TILE_SIZE;
            canvas.height = ROWS * TILE_SIZE;

            // Le dimensioni CSS determinano lo zoom visivo
            canvas.style.width = (canvas.width * currentZoom) + 'px';
            canvas.style.height = (canvas.height * currentZoom) + 'px';
        }

        function changeZoom(delta) {
            currentZoom += delta;
            if (currentZoom < 0.2) currentZoom = 0.2; // Zoom Minimo 20%
            if (currentZoom > 5) currentZoom = 5;     // Zoom Massimo 500%

            document.getElementById('zoom-lbl').textContent = Math.round(currentZoom * 100) + '%';
            updateCanvasSize();
            drawMap();
        }

        function resetZoom() {
            currentZoom = 1;
            document.getElementById('zoom-lbl').textContent = '100%';
            updateCanvasSize();
            drawMap();
        }

        // Ascolta la rotellina del mouse nel workspace
        const workspace = document.getElementById('workspace');
        workspace.addEventListener('wheel', (e) => {
            // Se preme Ctrl o Cmd, fa lo Zoom, altrimenti scorre la pagina normalmente
            if (e.ctrlKey || e.metaKey) {
                e.preventDefault(); // Blocca lo zoom di tutto il sito web del browser
                const delta = e.deltaY > 0 ? -0.1 : 0.1;
                changeZoom(delta);
            }
        }, { passive: false });

        // ==========================================
        // NUOVO: GESTIONE SPOSTAMENTO TELECAMERA CON WASD
        // ==========================================
        const keys = { w: false, a: false, s: false, d: false };
        const panSpeed = 15; // Velocità in pixel dello spostamento

        window.addEventListener('keydown', (e) => {
            // Evita che premendo W/A/S/D si attivi la telecamera se stai scrivendo nel nome o nel codice
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) {
                keys[key] = true;
            }
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) {
                keys[key] = false;
            }
        });

        function panLoop() {
            if (keys.w) workspace.scrollTop -= panSpeed;
            if (keys.s) workspace.scrollTop += panSpeed;
            if (keys.a) workspace.scrollLeft -= panSpeed;
            if (keys.d) workspace.scrollLeft += panSpeed;

            requestAnimationFrame(panLoop);
        }
        // Avvia il loop di scorrimento appena si apre l'editor
        requestAnimationFrame(panLoop);
        // ==========================================


        function selectTool(toolId) {
            currentTool = toolId;
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`t-${toolId}`).classList.add('active');
        }

        function drawMap() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    let tile = mapData[r][c];
                    const x = c * TILE_SIZE;
                    const y = r * TILE_SIZE;

                    // Colore base
                    ctx.fillStyle = colors[tile] || colors[0];
                    ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);

                    // Bordo griglia
                    ctx.strokeStyle = 'rgba(0,0,0,0.05)';
                    ctx.strokeRect(x, y, TILE_SIZE, TILE_SIZE);

                    if (tile === 2) {
                        ctx.fillStyle = '#2c3e50';
                        ctx.fillRect(x, y, TILE_SIZE / 2, TILE_SIZE / 2);
                        ctx.fillRect(x + TILE_SIZE / 2, y + TILE_SIZE / 2, TILE_SIZE / 2, TILE_SIZE / 2);
                    } else if (tile === 4) {
                        ctx.fillStyle = '#795548'; // Ghiaia base
                        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                        ctx.fillStyle = '#5D4037'; // Puntini più scuri
                        for (let i = 0; i < 5; i++) {
                            ctx.fillRect(x + Math.random() * (TILE_SIZE - 2), y + Math.random() * (TILE_SIZE - 2), 2, 2);
                        }
                    }

                    // Indicatori visuali per CORDOLI (Rosso)
                    const curbThick = 4;
                    ctx.fillStyle = '#e74c3c';

                    if (tile === 11) ctx.fillRect(x, y, TILE_SIZE, curbThick);
                    if (tile === 12) ctx.fillRect(x + TILE_SIZE - curbThick, y, curbThick, TILE_SIZE);
                    if (tile === 13) ctx.fillRect(x, y + TILE_SIZE - curbThick, TILE_SIZE, curbThick);
                    if (tile === 14) ctx.fillRect(x, y, curbThick, TILE_SIZE);

                    if (tile === 21) { ctx.fillRect(x, y, TILE_SIZE, curbThick); ctx.fillRect(x, y, curbThick, TILE_SIZE); }
                    if (tile === 22) { ctx.fillRect(x, y, TILE_SIZE, curbThick); ctx.fillRect(x + TILE_SIZE - curbThick, y, curbThick, TILE_SIZE); }
                    if (tile === 23) { ctx.fillRect(x, y + TILE_SIZE - curbThick, TILE_SIZE, curbThick); ctx.fillRect(x, y, curbThick, TILE_SIZE); }
                    if (tile === 24) { ctx.fillRect(x, y + TILE_SIZE - curbThick, TILE_SIZE, curbThick); ctx.fillRect(x + TILE_SIZE - curbThick, y, curbThick, TILE_SIZE); }

                    // Indicatori visuali per Curve Interne
                    const innerSize = 6;
                    if (tile === 31) ctx.fillRect(x, y, innerSize, innerSize);
                    if (tile === 32) ctx.fillRect(x + TILE_SIZE - innerSize, y, innerSize, innerSize);
                    if (tile === 33) ctx.fillRect(x + TILE_SIZE - innerSize, y + TILE_SIZE - innerSize, innerSize, innerSize);
                    if (tile === 34) ctx.fillRect(x, y + TILE_SIZE - innerSize, innerSize, innerSize);
                }
            }

            // Disegna punto di spawn
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.arc(spawnTileX * TILE_SIZE + TILE_SIZE / 2, spawnTileY * TILE_SIZE + TILE_SIZE / 2, TILE_SIZE / 2 - 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "white";
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function handlePointer(e) {
            const rect = canvas.getBoundingClientRect();
            // LA MAGIA: scaleX / scaleY fanno sì che il tuo mouse funzioni perfettamente a prescindere dal livello di Zoom!
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;

            const col = Math.floor(x / TILE_SIZE);
            const row = Math.floor(y / TILE_SIZE);

            if (row >= 0 && row < ROWS && col >= 0 && col < COLS) {
                if (currentTool === 'spawn') {
                    if (e.type === 'mousedown') {
                        spawnTileX = col;
                        spawnTileY = row;
                        drawMap();
                    }
                } else {
                    if (isDrawing && mapData[row][col] !== currentTool) {
                        mapData[row][col] = currentTool;
                        drawMap();
                    }
                }
            }
        }

        canvas.addEventListener('mousedown', (e) => { isDrawing = true; handlePointer(e); });
        canvas.addEventListener('mousemove', (e) => { if (isDrawing) handlePointer(e); });
        window.addEventListener('mouseup', () => { isDrawing = false; });

        function exportMap() {
            const trackName = document.getElementById('track-name').value || 'CustomMap';
            const cleanVarName = trackName.replace(/[^a-zA-Z0-9]/g, '');
            const angle = parseInt(document.getElementById('spawn-angle').value) || 0;

            const realSpawnX = spawnTileX * 80;
            const realSpawnY = spawnTileY * 80;

            let out = `const ${cleanVarName}Map = [\n`;
            for (let r = 0; r < ROWS; r++) {
                const rowStr = mapData[r].map(num => num.toString().padStart(2, ' ')).join(', ');
                out += `  /* ${r.toString().padStart(2, '0')} */[${rowStr}]`;
                out += (r < ROWS - 1) ? ",\n" : "\n";
            }
            out += `];\n\n`;

            out += `    {\n`;
            out += `        name: "${trackName}",\n`;
            out += `        map: ${cleanVarName}Map,\n`;
            out += `        spawnX: ${realSpawnX},\n`;
            out += `        spawnY: ${realSpawnY},\n`;
            out += `        angle: ${angle}\n`;
            out += `    }`;

            document.getElementById('output-code').value = out;
        }

        function importMap() {
            try {
                let input = document.getElementById('output-code').value;
                const startIndex = input.indexOf('[');
                const endIndex = input.lastIndexOf(']');

                if (startIndex === -1 || endIndex === -1) {
                    alert('Errore: Impossibile trovare un array [ ... ] nel testo incollato.');
                    return;
                }

                let arrayStr = input.substring(startIndex, endIndex + 1);
                arrayStr = arrayStr.replace(/\/\*[\s\S]*?\*\//g, '').replace(/\/\/.*/g, '');
                arrayStr = arrayStr.replace(/,\s*]/g, ']');

                const importedMap = eval('(' + arrayStr + ')');

                if (Array.isArray(importedMap) && Array.isArray(importedMap[0])) {
                    ROWS = importedMap.length;
                    COLS = importedMap[0].length;
                    document.getElementById('grid-rows').value = ROWS;
                    document.getElementById('grid-cols').value = COLS;

                    mapData = importedMap;
                    updateCanvasSize(); // Aggiorna scala dopo l'import
                    drawMap();

                    document.getElementById('output-code').value = '';
                    alert('✅ Mappa Importata con successo!');
                } else {
                    alert('Formato array non valido.');
                }
            } catch (err) {
                alert('❌ Errore di importazione. Controlla la console.');
                console.error(err);
            }
        }

        initMap();
    </script>
</body>
