<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mockup Quiz - Stile Gartic/Kahoot</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #E3F2FD;
            --border-color: #2C3E50;
            --panel-bg: #FFFFFF;
            --green: #2ECC71;
            --yellow: #F1C40F;
            --red: #E74C3C;
            --blue: #3498DB;
            --border-width: 4px;
            --shadow-size: 8px;
        }

        body {
            background: var(--bg-color);
            background-image: radial-gradient(#bdc3c7 2px, transparent 2px);
            background-size: 30px 30px;
            font-family: 'Fredoka', sans-serif;
            color: var(--border-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .layout {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 25px;
            max-width: 1200px;
            width: 100%;
        }

        .panel {
            background: var(--panel-bg);
            border: var(--border-width) solid var(--border-color);
            border-radius: 16px;
            box-shadow: var(--shadow-size) var(--shadow-size) 0px var(--border-color);
        }

        /* --- CLASSIFICA LATERALE --- */
        .sidebar {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar h2 {
            margin: 0 0 10px 0;
            text-align: center;
            border-bottom: 4px solid var(--border-color);
            padding-bottom: 10px;
        }

        .score-row {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #ecf0f1;
            border: 3px solid var(--border-color);
            padding: 8px;
            border-radius: 12px;
        }

        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 3px solid var(--border-color);
        }

        .score-pts {
            margin-left: auto;
            font-weight: bold;
            background: white;
            padding: 2px 8px;
            border-radius: 6px;
            border: 2px solid var(--border-color);
        }

        /* --- AREA QUIZ CENTRALE --- */
        .quiz-area {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Top Bar */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 15px 30px;
            border-radius: 16px;
            border: var(--border-width) solid var(--border-color);
            box-shadow: 4px 4px 0 var(--border-color);
            font-size: 24px;
            font-weight: bold;
        }

        .timer-badge {
            background: var(--red);
            color: white;
            padding: 5px 15px;
            border-radius: 10px;
            border: 3px solid var(--border-color);
            box-shadow: 3px 3px 0 var(--border-color);
        }

        /* Domanda */
        .question-card {
            background: white;
            padding: 40px;
            text-align: center;
            font-size: 32px;
            font-weight: 700;
        }

        /* Risposte */
        .answers-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .ans-btn {
            border: var(--border-width) solid var(--border-color);
            border-radius: 16px;
            padding: 30px 20px;
            font-family: 'Fredoka';
            font-size: 24px;
            font-weight: 700;
            color: white;
            cursor: pointer;
            box-shadow: var(--shadow-size) var(--shadow-size) 0px var(--border-color);
            transition: transform 0.1s;
            text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.2);
            /* Centrare testo */
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .ans-btn:active {
            transform: translate(6px, 6px);
            box-shadow: 0px 0px 0px transparent;
        }

        .ans-blue {
            background: var(--blue);
        }

        .ans-red {
            background: var(--red);
        }

        .ans-yellow {
            background: var(--yellow);
            color: var(--border-color);
            text-shadow: none;
        }

        .ans-green {
            background: var(--green);
        }
    </style>
</head>

<body>
    <div class="layout">

        <div class="panel sidebar">
            <h2>Punti</h2>
            <div class="score-row">
                <span style="font-weight: bold;">1°</span>
                <div class="avatar" style="background: var(--yellow);"></div>
                <span class="score-pts">1500</span>
            </div>
            <div class="score-row">
                <span style="font-weight: bold;">2°</span>
                <div class="avatar" style="background: var(--red);"></div>
                <span class="score-pts">1200</span>
            </div>
            <div class="score-row">
                <span style="font-weight: bold;">3°</span>
                <div class="avatar" style="background: var(--blue);"></div>
                <span class="score-pts">800</span>
            </div>
        </div>

        <div class="quiz-area">

            <div class="quiz-header">
                <div>Domanda 4/10</div>
                <div class="timer-badge">⏱️ 12</div>
            </div>

            <div class="panel question-card">
                In quale città si trova il Colosseo?
            </div>

            <div class="answers-grid">
                <button class="ans-btn ans-blue">Milano</button>
                <button class="ans-btn ans-red">Roma</button>
                <button class="ans-btn ans-yellow">Napoli</button>
                <button class="ans-btn ans-green">Venezia</button>
            </div>

        </div>
    </div>
</body>

</html>
