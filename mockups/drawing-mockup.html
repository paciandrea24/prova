<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mockup Disegno - Stile Gartic</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #E3F2FD;
            --border-color: #2C3E50;
            --panel-bg: #FFFFFF;
            --green: #2ECC71;
            --yellow: #F1C40F;
            --red: #E74C3C;
            --blue: #3498DB;
            --border-width: 4px;
            --shadow-size: 6px;
        }

        body {
            background: var(--bg-color);
            background-image: radial-gradient(#bdc3c7 2px, transparent 2px);
            background-size: 30px 30px;
            font-family: 'Fredoka', sans-serif;
            color: var(--border-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
            height: 85vh;
        }

        .panel {
            background: var(--panel-bg);
            border: var(--border-width) solid var(--border-color);
            border-radius: 16px;
            box-shadow: var(--shadow-size) var(--shadow-size) 0px var(--border-color);
        }

        /* --- COLONNA DISEGNO --- */
        .main-col {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            font-size: 24px;
            font-weight: 700;
            background: var(--yellow);
        }

        .word-to-draw {
            letter-spacing: 5px;
            background: white;
            padding: 5px 15px;
            border-radius: 10px;
            border: 3px solid var(--border-color);
        }

        .canvas-area {
            flex: 1;
            position: relative;
            background: white;
            cursor: crosshair;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .canvas-placeholder {
            font-size: 40px;
            color: #ecf0f1;
            font-weight: bold;
            text-align: center;
        }

        /* Strumenti */
        .tools-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #ecf0f1;
        }

        .colors {
            display: flex;
            gap: 8px;
        }

        .color-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 3px solid var(--border-color);
            cursor: pointer;
            box-shadow: 2px 2px 0px var(--border-color);
            transition: transform 0.1s;
        }

        .color-btn:active {
            box-shadow: none;
            transform: translate(2px, 2px);
        }

        .sizes {
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 3px dashed #bdc3c7;
            padding-left: 15px;
        }

        .size-btn {
            background: var(--border-color);
            border-radius: 50%;
            cursor: pointer;
        }

        .sz-1 {
            width: 10px;
            height: 10px;
        }

        .sz-2 {
            width: 18px;
            height: 18px;
        }

        .sz-3 {
            width: 26px;
            height: 26px;
        }

        .btn-clear {
            background: var(--red);
            color: white;
            border: 3px solid var(--border-color);
            padding: 5px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 2px 2px 0 var(--border-color);
        }

        /* --- COLONNA CHAT/INDOVINA --- */
        .chat-col {
            display: flex;
            flex-direction: column;
            padding: 15px;
        }

        .chat-title {
            font-size: 20px;
            font-weight: bold;
            border-bottom: 3px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 10px;
            text-align: center;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .msg {
            padding: 8px 12px;
            border-radius: 8px;
            background: #ecf0f1;
            font-weight: 600;
            font-size: 15px;
            border: 2px solid var(--border-color);
            display: flex;
            gap: 8px;
            align-items: center;
        }

        /* Messaggio Indovinato */
        .msg.correct {
            background: var(--green);
            color: white;
        }

        .chat-input-area {
            display: flex;
            gap: 5px;
            margin-top: 15px;
        }

        .chat-input {
            flex: 1;
            border: 3px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            font-family: 'Fredoka';
            font-weight: bold;
            outline: none;
        }

        .chat-submit {
            background: var(--blue);
            color: white;
            border: 3px solid var(--border-color);
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 45px;
            box-shadow: 3px 3px 0 var(--border-color);
        }

        .chat-submit:active {
            box-shadow: none;
            transform: translate(3px, 3px);
        }
    </style>
</head>

<body>
    <div class="layout">
        <div class="main-col">
            <div class="panel top-bar">
                <div>⏱️ 45</div>
                <div class="word-to-draw">C A _ E</div>
                <div style="font-size: 16px;">Turno 2/3</div>
            </div>

            <div class="panel canvas-area">
                <div class="canvas-placeholder">Area Disegno<br>🖍️</div>
            </div>

            <div class="panel tools-bar">
                <div class="colors">
                    <div class="color-btn" style="background: #000;"></div>
                    <div class="color-btn" style="background: #fff;"></div>
                    <div class="color-btn" style="background: var(--red);"></div>
                    <div class="color-btn" style="background: var(--blue);"></div>
                    <div class="color-btn" style="background: var(--green);"></div>
                    <div class="color-btn" style="background: var(--yellow);"></div>
                </div>
                <div class="sizes">
                    <div class="size-btn sz-1"></div>
                    <div class="size-btn sz-2"></div>
                    <div class="size-btn sz-3"></div>
                </div>
                <button class="btn-clear">🗑️ Cancella</button>
            </div>
        </div>

        <div class="panel chat-col">
            <div class="chat-title">Indovina la parola!</div>
            <div class="chat-messages">
                <div class="msg">
                    <div
                        style="width:15px; height:15px; border-radius:50%; background:var(--blue); border:2px solid #2C3E50;">
                    </div> Gatto?
                </div>
                <div class="msg">
                    <div
                        style="width:15px; height:15px; border-radius:50%; background:var(--red); border:2px solid #2C3E50;">
                    </div> Cavallo
                </div>
                <div class="msg correct">⭐ Il Giallo ha indovinato!</div>
            </div>
            <div class="chat-input-area">
                <input type="text" class="chat-input" placeholder="Scrivi qui...">
                <button class="chat-submit">➤</button>
            </div>
        </div>
    </div>
</body>

</html>
