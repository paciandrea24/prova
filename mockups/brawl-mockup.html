<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mockup - Brawl-Ball (Fullscreen)</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --border-color: #2C3E50;
            --green: #2ECC71;
            --yellow: #F1C40F;
            --red: #E74C3C;
            --blue: #3498DB;
            --orange: #E67E22;
            --shadow-size: 6px;
        }

        body {
            /* Sfondo di base nel caso in cui lo schermo sia più largo del gioco */
            background-color: #2c3e50;
            font-family: 'Fredoka', sans-serif;
            color: var(--border-color);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* L'arena occupa quasi tutto lo schermo */
        .game-window {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1600px;
            background: #87CEEB;
            /* Cielo */
            border: 6px solid var(--border-color);
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5), inset 0 0 50px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        /* Nuvole di sfondo dell'arena */
        .game-window::before {
            content: '☁️ ☁️ ☁️ ☁️';
            position: absolute;
            top: 50px;
            left: 10%;
            font-size: 100px;
            opacity: 0.3;
            letter-spacing: 200px;
            white-space: nowrap;
        }

        /* --- HUD (IN SOVRIMPRESSIONE) --- */

        /* Stile base per i pannelli semi-trasparenti (Vetro cartoonesco) */
        .hud-panel {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 3px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 4px 4px 0 rgba(44, 62, 80, 0.5);
            z-index: 100;
            /* Sempre sopra i giocatori */
        }

        /* Top Bar centrale */
        .hud-top {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 5px 25px;
        }

        .game-title {
            font-size: 26px;
            font-weight: 900;
            text-transform: uppercase;
            margin: 0;
        }

        .timer-box {
            font-size: 26px;
            font-weight: bold;
            color: var(--red);
        }

        /* Controlli (In alto a sinistra) */
        .hud-controls {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 8px 15px;
            font-weight: bold;
            font-size: 14px;
        }

        /* Pannello dei Danni (In basso) */
        .hud-damage-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            width: 90%;
            max-width: 1000px;
            z-index: 100;
        }

        .damage-card {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
            transition: transform 0.2s;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: bold;
        }

        .damage-card .avatar-circle {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 3px solid var(--border-color);
        }

        .damage-value {
            font-size: 40px;
            font-weight: 900;
            color: var(--border-color);
            text-shadow: 2px 2px 0px rgba(255, 255, 255, 0.8);
        }

        .damage-card.danger .damage-value {
            color: var(--red);
            animation: shake 0.3s infinite alternate;
        }

        .damage-card.eliminated {
            background: rgba(0, 0, 0, 0.4);
            color: white;
            border-color: #555;
            box-shadow: none;
            backdrop-filter: grayscale(100%);
        }

        .damage-card.eliminated .damage-value {
            font-size: 28px;
            text-shadow: none;
            color: #ccc;
            margin-top: 5px;
        }

        .damage-card.eliminated .card-header {
            opacity: 0.5;
        }

        /* --- ELEMENTI DI GIOCO --- */
        .platform {
            position: absolute;
            background: var(--orange);
            border: 4px solid var(--border-color);
            border-radius: 10px;
            border-top: 12px solid var(--green);
            box-shadow: 0 10px 0 rgba(0, 0, 0, 0.1) inset;
        }

        .platform-main {
            bottom: 10%;
            left: 15%;
            right: 15%;
            height: 10%;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
        }

        .platform-float-left {
            bottom: 40%;
            left: 20%;
            width: 15%;
            height: 25px;
        }

        .platform-float-right {
            bottom: 40%;
            right: 20%;
            width: 15%;
            height: 25px;
        }

        .platform-float-top {
            bottom: 65%;
            left: 40%;
            right: 40%;
            height: 25px;
        }

        /* I Giocatori */
        .brawler {
            position: absolute;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 4px solid var(--border-color);
            box-shadow: inset -5px -5px 0 rgba(0, 0, 0, 0.3);
            z-index: 50;
            /* Sotto l'HUD (100) ma sopra il livello */
        }

        .brawler.me {
            border-color: white;
            box-shadow: 0 0 0 4px var(--border-color), inset -5px -5px 0 rgba(0, 0, 0, 0.3);
        }

        .dash-trail {
            position: absolute;
            top: 12px;
            right: 45px;
            width: 80px;
            height: 20px;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.9));
            border-radius: 10px;
        }

        .flying-fx {
            position: absolute;
            top: -20px;
            left: -20px;
            font-size: 35px;
            animation: shake 0.1s infinite;
        }

        @keyframes shake {
            0% {
                transform: translateX(-2px);
            }

            100% {
                transform: translateX(2px);
            }
        }
    </style>
</head>

<body>
    <div class="game-window">

        <div class="hud-panel hud-controls">
            🕹️ Frecce: Muoviti/Salta<br>
            🟩 Spazio: Scatto
        </div>

        <div class="hud-panel hud-top">
            <h1 class="game-title">💥 Brawl-Ball</h1>
            <div class="timer-box">⏱️ 01:45</div>
        </div>

        <div class="hud-damage-container">
            <div class="hud-panel damage-card">
                <div class="card-header">
                    <div class="avatar-circle" style="background: var(--red);"></div>Tu
                </div>
                <div class="damage-value">24%</div>
            </div>
            <div class="hud-panel damage-card">
                <div class="card-header">
                    <div class="avatar-circle" style="background: var(--blue);"></div>Blu
                </div>
                <div class="damage-value">85%</div>
            </div>
            <div class="hud-panel damage-card danger">
                <div class="card-header">
                    <div class="avatar-circle" style="background: var(--green);"></div>Verde
                </div>
                <div class="damage-value">160%</div>
            </div>
            <div class="hud-panel damage-card eliminated">
                <div class="card-header">
                    <div class="avatar-circle" style="background: var(--yellow);"></div>Giallo
                </div>
                <div class="damage-value">💀 ELIMINATO</div>
            </div>
        </div>

        <div class="platform platform-float-top"></div>
        <div class="platform platform-float-left"></div>
        <div class="platform platform-float-right"></div>
        <div class="platform platform-main"></div>

        <div class="brawler me" style="left: 25%; bottom: 43%; background-color: var(--red);"></div>
        <div class="brawler" style="left: 50%; bottom: 20%; background-color: var(--blue);"></div>
        <div class="brawler" style="left: 35%; bottom: 20%; background-color: var(--yellow);">
            <div class="dash-trail"></div>
        </div>
        <div class="brawler" style="left: 85%; bottom: 70%; background-color: var(--green);">
            <div class="flying-fx">💢</div>
        </div>

    </div>
</body>

</html>
