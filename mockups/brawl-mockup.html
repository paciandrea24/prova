<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mockup - Brawl Football</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #E3F2FD;
            --border-color: #2C3E50;
            --panel-bg: #FFFFFF;

            --green: #2ECC71;
            --yellow: #F1C40F;
            --red: #E74C3C;
            --blue: #3498DB;
            --purple: #9b59b6;
            --orange: #e67e22;

            --border-width: 4px;
            --shadow-size: 6px;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(#bdc3c7 2px, transparent 2px);
            background-size: 30px 30px;
            font-family: 'Fredoka', sans-serif;
            color: var(--border-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
            gap: 15px;
            /* Spazio tra vite e campo */
        }

        /* --- LIVES BOARD (SOLO COLORI) --- */
        .lives-panel {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            width: 100%;
            max-width: 1200px;
            /* Nessun background ingombrante, le pillole fluttuano libere */
        }

        .life-pill {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--panel-bg);
            border: 3px solid var(--border-color);
            border-radius: 25px;
            padding: 8px 16px;
            font-weight: 700;
            font-size: 18px;
            box-shadow: 4px 4px 0 var(--border-color);
            transition: transform 0.2s;
        }

        .life-pill.eliminated {
            opacity: 0.5;
            background: #bdc3c7;
            text-decoration: line-through;
            box-shadow: 2px 2px 0 var(--border-color);
        }

        .color-dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 3px solid var(--border-color);
        }

        .hearts {
            color: var(--red);
            letter-spacing: 2px;
            font-size: 20px;
        }

        /* --- GAME AREA CONTENITORE --- */
        .game-container {
            background: var(--panel-bg);
            border: var(--border-width) solid var(--border-color);
            border-radius: 16px;
            box-shadow: var(--shadow-size) var(--shadow-size) 0 var(--border-color);
            width: 100%;
            max-width: 1400px;
            /* Limite massimo per non sgranare su schermi ultrawide */
            flex: 1;
            /* IL SEGRETO: prende tutto lo spazio verticale rimanente */
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            /* Evita qualsiasi sbordamento */
        }

        /* --- CANVAS DEL CAMPO --- */
        #game-canvas {
            /* Adatta il canvas al 100% dello spazio disponibile nel container mantenendo il ratio quadrato */
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 1 / 1;
            object-fit: contain;
        }

        /* --- TASTO ESCI FLUTTUANTE NEL CAMPO --- */
        .btn-leave {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: #bdc3c7;
            color: var(--border-color);
            border: var(--border-width) solid var(--border-color);
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: bold;
            font-family: 'Fredoka', sans-serif;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 4px 4px 0 var(--border-color);
            text-transform: uppercase;
            transition: transform 0.1s;
            z-index: 10;
        }

        .btn-leave:active {
            box-shadow: none;
            transform: translate(4px, 4px);
        }

        /* --- GAME OVER MODAL --- */
        .game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(44, 62, 80, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .go-content {
            background: var(--panel-bg);
            border: var(--border-width) solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 8px 8px 0px var(--border-color);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .go-title {
            font-size: 32px;
            font-weight: 900;
            margin: 0;
            color: var(--border-color);
            text-transform: uppercase;
        }

        .winner-display {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            background: #ecf0f1;
            border: 4px solid var(--border-color);
            padding: 15px 25px;
            border-radius: 50px;
            font-size: 24px;
            font-weight: bold;
        }

        .winner-color {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 4px solid var(--border-color);
        }

        .btn-primary {
            background: var(--blue);
            color: white;
            border: 4px solid var(--border-color);
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: bold;
            font-family: 'Fredoka', sans-serif;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 4px 4px 0 var(--border-color);
            text-transform: uppercase;
            width: 100%;
            margin-top: 10px;
        }

        .btn-primary:active {
            box-shadow: none;
            transform: translate(4px, 4px);
        }

        @keyframes popIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div class="lives-panel">
        <div class="life-pill">
            <div class="color-dot" style="background-color: var(--blue);"></div>
            <span class="hearts">❤️❤️❤️</span>
        </div>
        <div class="life-pill">
            <div class="color-dot" style="background-color: var(--red);"></div>
            <span class="hearts">❤️❤️</span>
        </div>
        <div class="life-pill">
            <div class="color-dot" style="background-color: var(--green);"></div>
            <span class="hearts">❤️</span>
        </div>
        <div class="life-pill">
            <div class="color-dot" style="background-color: var(--yellow);"></div>
            <span class="hearts">❤️❤️❤️</span>
        </div>
        <div class="life-pill eliminated">
            <div class="color-dot" style="background-color: var(--purple);"></div>
            <span class="hearts">💀</span>
        </div>
        <div class="life-pill eliminated">
            <div class="color-dot" style="background-color: var(--orange);"></div>
            <span class="hearts">💀</span>
        </div>
    </div>

    <div class="game-container">

        <canvas id="game-canvas" width="1000" height="1000"></canvas>

        <button class="btn-leave">Torna alla Lobby</button>

        <div class="game-over-overlay" id="victory-panel" style="display: none;">
            <div class="go-content">
                <h2 class="go-title">PARTITA FINITA!</h2>
                <div class="winner-display">
                    <div class="winner-color" style="background-color: var(--blue);"></div>
                    <span>Ha Vinto!</span>
                </div>
                <button class="btn-primary" onclick="toggleGameOver()">Gioca Ancora</button>
            </div>
        </div>

    </div>

    <button onclick="toggleGameOver()" style="position:fixed; top:5px; right:5px; font-size:10px; cursor:pointer;">Test
        Fine Partita</button>

    <script>
        function toggleGameOver() {
            const panel = document.getElementById('victory-panel');
            panel.style.display = panel.style.display === 'none' ? 'flex' : 'none';
        }

        // Script per simulare il disegno del prato e dimostrare come riempie lo spazio
        window.onload = () => {
            const canvas = document.getElementById('game-canvas');
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            const centerX = width / 2;
            const centerY = height / 2;
            const radius = 450; // Raggio aumentato proporzionalmente alla grandezza 1000x1000
            const sides = 6;

            // Disegna Sfondo Verde del campo (Il Prato Esagonale)
            ctx.beginPath();
            for (let i = 0; i < sides; i++) {
                const angle = i * 2 * Math.PI / sides - Math.PI / 2;
                ctx.lineTo(centerX + radius * Math.cos(angle), centerY + radius * Math.sin(angle));
            }
            ctx.closePath();
            ctx.fillStyle = '#2ECC71';
            ctx.fill();
            ctx.lineWidth = 20;
            ctx.strokeStyle = '#2C3E50';
            ctx.stroke();

            // Linee del campo decorative
            ctx.beginPath();
            ctx.arc(centerX, centerY, 100, 0, 2 * Math.PI);
            ctx.lineWidth = 10;
            ctx.strokeStyle = 'rgba(255,255,255,0.4)';
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(centerX, centerY, 15, 0, 2 * Math.PI);
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.fill();

            // Porte finte
            const colors = ['#3498DB', '#E74C3C', '#2ECC71', '#F1C40F', '#9b59b6', '#e67e22'];
            for (let i = 0; i < sides; i++) {
                const angle = i * 2 * Math.PI / sides - Math.PI / 2;
                const nextAngle = (i + 1) * 2 * Math.PI / sides - Math.PI / 2;

                const midX = (centerX + radius * Math.cos(angle) + centerX + radius * Math.cos(nextAngle)) / 2;
                const midY = (centerY + radius * Math.sin(angle) + centerY + radius * Math.sin(nextAngle)) / 2;

                ctx.beginPath();
                ctx.arc(midX, midY, 50, angle + Math.PI / 2, angle + Math.PI / 2 + Math.PI);
                ctx.fillStyle = colors[i];
                ctx.fill();
                ctx.lineWidth = 5;
                ctx.strokeStyle = '#2C3E50';
                ctx.stroke();
            }
        };
    </script>
</body>

</html>
